<title>Settings</title>
<style>
:root {
  --bg: #EFEEF4; --surface: #FCFBFE; --surface-2: #F4F2F9;
  --ink: #191627; --ink-muted: #6A6480; --rule: #DCD8E6;
  --done-bg: #EDEAF4; --done-ink: #8B84A6;
  --todo-bg: #6D4AC4; --todo-ink: #FFFFFF;
  --opt-bg: #2563C9; --opt-ink: #FFFFFF;
  --ok: #2F6B4F; --warn: #8A5A00; --bad: #A33A28;
  --shadow: 0 1px 2px rgba(25,22,39,.06), 0 2px 8px rgba(25,22,39,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131019; --surface: #1B1826; --surface-2: #232032;
    --ink: #EBE8F5; --ink-muted: #948DAD; --rule: #2E2A3D;
    --done-bg: #221E30; --done-ink: #7B7496;
    --todo-bg: #8B63E8; --todo-ink: #120E1C;
    --opt-bg: #5B9BF0; --opt-ink: #0B1424;
    --ok: #6FBF95; --warn: #E8B85C; --bad: #E3806B;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #131019; --surface: #1B1826; --surface-2: #232032;
  --ink: #EBE8F5; --ink-muted: #948DAD; --rule: #2E2A3D;
  --done-bg: #221E30; --done-ink: #7B7496;
  --todo-bg: #8B63E8; --todo-ink: #120E1C;
  --opt-bg: #5B9BF0; --opt-ink: #0B1424;
  --ok: #6FBF95; --warn: #E8B85C; --bad: #E3806B;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.3);
}
:root[data-theme="light"] {
  --bg: #EFEEF4; --surface: #FCFBFE; --surface-2: #F4F2F9;
  --ink: #191627; --ink-muted: #6A6480; --rule: #DCD8E6;
  --done-bg: #EDEAF4; --done-ink: #8B84A6;
  --todo-bg: #6D4AC4; --todo-ink: #FFFFFF;
  --opt-bg: #2563C9; --opt-ink: #FFFFFF;
  --ok: #2F6B4F; --warn: #8A5A00; --bad: #A33A28;
  --shadow: 0 1px 2px rgba(25,22,39,.06), 0 2px 8px rgba(25,22,39,.04);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
.eyebrow {
  font-family: ui-monospace, Menlo, monospace; font-size: .66rem;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 6px;
}
h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -.02em; margin: 0 0 4px; }
.sub { color: var(--ink-muted); font-size: .86rem; margin: 0 0 18px; line-height: 1.45; }
.card {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: var(--shadow); overflow: hidden;
}
.head, .row {
  display: grid; grid-template-columns: 1fr 96px 250px; gap: 12px; align-items: center;
  padding: 10px 14px;
}
.head {
  font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-muted); background: var(--surface-2); border-bottom: 1px solid var(--rule);
}
.row + .row { border-top: 1px solid var(--rule); }
.title { font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
.title .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--todo-bg); flex: 0 0 auto; }
.row.optional .title .dot { background: var(--opt-bg); }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: .84rem; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--opt-bg); }
.deadline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: .8rem; }
.deadline input[type=time] {
  font: inherit; font-family: ui-monospace, Menlo, monospace; padding: 5px 6px;
  border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--ink);
}
.deadline label { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-muted); }
.deadline .clear {
  border: none; background: none; color: var(--ink-muted); cursor: pointer; font: inherit;
  text-decoration: underline; padding: 0;
}
.row.saving { opacity: .6; }
.notice {
  border: 1px solid var(--warn); color: var(--ink); background: var(--surface);
  padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: .86rem; line-height: 1.45;
}
.notice code { font-size: .8rem; }
#status { margin-top: 14px; font-size: .82rem; min-height: 1.3em; font-family: ui-monospace, Menlo, monospace; }
#status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
@media (max-width: 560px) {
  .head { display: none; }
  .row { grid-template-columns: 1fr auto; }
  .deadline { grid-column: 1 / -1; }
}
</style>

<div class="wrap">
  <p class="eyebrow">Task Tracker</p>
  <h1>Settings</h1>
  <p class="sub">Optional tasks show blue and an unticked one never counts as a miss.
    A deadline flags the task as missed on Today if it is ticked after the deadline,
    or is still unticked once it passes. Tick <b>next day</b> for a deadline after midnight.</p>
  <div id="notice"></div>
  <div class="card">
    <div class="head"><span>Task</span><span>Optional</span><span>Deadline</span></div>
    <div id="rows"></div>
  </div>
  <div id="status"></div>
</div>

<script id="bootstrap" type="application/json">__BOOTSTRAP__</script>
<script>
(function () {
  var BOOT = JSON.parse(document.getElementById('bootstrap').textContent);

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function say(msg, bad) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = !msg ? '' : (bad ? 'bad' : 'ok');
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  /* minutes -> [HH:MM, next day?] and back. 1440 and up is the following day. */
  function split(m) {
    if (m === null || m === undefined) return ['', false];
    var next = m >= 1440, r = m % 1440;
    return [pad(Math.floor(r / 60)) + ':' + pad(r % 60), next];
  }
  function join(hhmm, next) {
    if (!hhmm) return null;
    var p = hhmm.split(':');
    return Number(p[0]) * 60 + Number(p[1]) + (next ? 1440 : 0);
  }

  function save(row, d, changes) {
    row.classList.add('saving');
    return fetch('/api/definitions/' + d.id, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(changes)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (j) {
        if (!res.ok) throw new Error(j.detail || ('HTTP ' + res.status));
        return j;
      });
    }).then(function (j) {
      d.optional = j.optional; d.deadline_minutes = j.deadline_minutes;
      say(d.title + ' saved');
      return j;
    }).catch(function (e) {
      say(e.message, true);
      throw e;
    }).then(function (j) { row.classList.remove('saving'); return j; },
            function (e) { row.classList.remove('saving'); paint(row, d); });
  }

  function paint(row, d) {
    row.classList.toggle('optional', !!d.optional);
    row.querySelector('.opt').checked = !!d.optional;
    var s = split(d.deadline_minutes);
    row.querySelector('.time').value = s[0];
    row.querySelector('.next').checked = s[1];
  }

  var host = document.getElementById('rows');
  if (!BOOT.migrated) {
    document.getElementById('notice').innerHTML =
      '<div class="notice">These settings need two new columns. Run ' +
      '<code>sql/migrations/2026-10-12_optional_and_deadline.sql</code> in the Supabase ' +
      'SQL editor, then reload this page.</div>';
  }

  BOOT.defs.forEach(function (d) {
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<div class="title"><span class="dot"></span><span>' + esc(d.title) + '</span></div>' +
      '<label class="switch"><input type="checkbox" class="opt"> Optional</label>' +
      '<div class="deadline">' +
        '<input type="time" class="time" aria-label="Deadline for ' + esc(d.title) + '">' +
        '<label><input type="checkbox" class="next"> next day</label>' +
        '<button type="button" class="clear">clear</button>' +
      '</div>';
    paint(row, d);
    host.appendChild(row);
    if (!BOOT.migrated) {
      Array.prototype.forEach.call(row.querySelectorAll('input, button'),
        function (el) { el.disabled = true; });
      return;
    }

    /* `d` changes only once the server confirms, so a failed save repaints
       the row back to what is actually stored. */
    row.querySelector('.opt').addEventListener('change', function (e) {
      row.classList.toggle('optional', e.target.checked);
      save(row, d, { optional: e.target.checked });
    });
    function saveDeadline() {
      var m = join(row.querySelector('.time').value, row.querySelector('.next').checked);
      if (m === d.deadline_minutes) return;
      save(row, d, { deadline_minutes: m });
    }
    /* `change` on a time input fires once the time is complete, not per keystroke. */
    row.querySelector('.time').addEventListener('change', saveDeadline);
    row.querySelector('.next').addEventListener('change', saveDeadline);
    row.querySelector('.clear').addEventListener('click', function () {
      row.querySelector('.time').value = '';
      row.querySelector('.next').checked = false;
      saveDeadline();
    });
  });
})();
</script>
