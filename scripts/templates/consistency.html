<title>Consistency</title>
<style>
:root {
  --bg: #EFEEF4; --surface: #FCFBFE; --surface-2: #F4F2F9;
  --ink: #191627; --ink-muted: #6A6480; --rule: #DCD8E6;
  --done: #4C6E43; --miss: #C24534; --warn: #B7791F; --accent: #6D4AC4;
  --empty: #E4E1EC;
  --shadow: 0 1px 2px rgba(25,22,39,.06), 0 2px 8px rgba(25,22,39,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131019; --surface: #1B1826; --surface-2: #232032;
    --ink: #EBE8F5; --ink-muted: #948DAD; --rule: #2E2A3D;
    --done: #6FAF5F; --miss: #D96A57; --warn: #D6A550; --accent: #8B63E8;
    --empty: #262232;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #131019; --surface: #1B1826; --surface-2: #232032;
  --ink: #EBE8F5; --ink-muted: #948DAD; --rule: #2E2A3D;
  --done: #6FAF5F; --miss: #D96A57; --warn: #D6A550; --accent: #8B63E8;
  --empty: #262232;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.3);
}
:root[data-theme="light"] {
  --bg: #EFEEF4; --surface: #FCFBFE; --surface-2: #F4F2F9;
  --ink: #191627; --ink-muted: #6A6480; --rule: #DCD8E6;
  --done: #4C6E43; --miss: #C24534; --warn: #B7791F; --accent: #6D4AC4;
  --empty: #E4E1EC;
  --shadow: 0 1px 2px rgba(25,22,39,.06), 0 2px 8px rgba(25,22,39,.04);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.mono {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 28px 18px 64px; }

.eyebrow {
  font-family: ui-monospace, Menlo, monospace; font-size: .66rem;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px;
}
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; margin: 0 0 6px; }
.sub { color: var(--ink-muted); font-size: .9rem; margin: 0; max-width: 66ch; line-height: 1.5; }

.strip {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 1px; background: var(--rule); border: 1px solid var(--rule);
  border-radius: 10px; overflow: hidden; margin: 20px 0; box-shadow: var(--shadow);
}
.cell { background: var(--surface); padding: 13px 15px; }
.cell .lbl {
  font-family: ui-monospace, Menlo, monospace; font-size: .62rem;
  letter-spacing: .11em; text-transform: uppercase; color: var(--ink-muted);
  display: block; margin-bottom: 5px;
}
.cell .v {
  font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums;
  font-size: 1.2rem; font-weight: 600; display: block;
}
.cell .sub2 { font-size: .68rem; color: var(--ink-muted); margin-top: 3px; display: block; }

.card {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden;
}
.card > h2 {
  font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-muted); margin: 0; padding: 12px 16px;
  border-bottom: 1px solid var(--rule); background: var(--surface-2);
}
.card .body { padding: 14px 16px; }

/* Ranking: plain bars rather than a chart -- one dimension, exact values. */
.rank { display: flex; flex-direction: column; gap: 9px; }
.row { display: grid; grid-template-columns: 170px 1fr 108px; gap: 12px; align-items: center; }
.row .name { font-size: .86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .name button {
  background: none; border: none; padding: 0; font: inherit; color: var(--ink);
  cursor: pointer; text-align: left; width: 100%;
}
.row .name button:hover { color: var(--accent); text-decoration: underline; }
.track { background: var(--empty); border-radius: 5px; height: 16px; overflow: hidden; }
.fill { height: 100%; border-radius: 5px; }
.row .num {
  font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums;
  font-size: .8rem; color: var(--ink-muted); text-align: right; white-space: nowrap;
}

select, input[type="range"] {
  font: inherit; font-size: .86rem; padding: 7px 10px; border-radius: 7px;
  border: 1px solid var(--rule); background: var(--bg); color: var(--ink);
}
input[type="range"] { padding: 0; }
.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.controls label { font-size: .78rem; color: var(--ink-muted); }
button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* Deep dive */
.headline { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.bigpct { font-family: ui-monospace, Menlo, monospace; font-size: 3rem; font-weight: 700; line-height: 1; }
.headline .meta { color: var(--ink-muted); font-size: .84rem; }

/* Weeks across, weekdays down -- GitHub's arrangement, and crucially its
   structure: the month labels are cells of the same table as the tiles,
   spanning their own weeks. They were previously a separate flex row sitting
   outside the scroll container, so the tiles moved and the labels did not. */
.heatwrap { display: flex; gap: 16px; align-items: flex-start; }

/* One grid holds the month labels, the weekday labels and the tiles, and every
   one of them is placed on an explicit line. That is what keeps a label over
   its own weeks: it spans the very columns it names, so it cannot drift out of
   step the way a separate row of labels did.

   Grid rather than a table because table-layout:fixed takes its columns from
   the first row -- which here is twelve colspan'd month headers -- and split
   the width twelve ways, drawing a four-week month wider than a five-week one.
   `1fr` columns are equal by construction, and they shrink to fit the
   container instead of overflowing into a scrollbar. */
/* Scrolls only when it has to. `1fr` keeps 53 weeks inside the container at
   any desktop width, so there is nothing to scroll; the 8px floor stops the
   tiles shrinking to nothing on a phone, where a whole year genuinely does not
   fit -- at 360px with no floor they came out half a pixel across. When the
   floor wins the grid overflows and this scrolls, and because the month labels
   are tracks of the same grid they scroll with the tiles rather than staying
   behind, which is what went wrong with the old separate label row. */
.heatscroll { flex: 1; min-width: 0; overflow-x: auto; padding-bottom: 4px; }
.heatgrid {
  display: grid; gap: 3px; width: 100%;
  grid-template-columns: 30px repeat(var(--weeks, 53), minmax(8px, 1fr));
  grid-template-rows: 15px repeat(7, auto);
}
.heatgrid .mlabel {
  grid-row: 1; align-self: end; font-size: .62rem; color: var(--ink-muted);
  font-family: ui-monospace, Menlo, monospace; white-space: nowrap; overflow: hidden;
}
.heatgrid .dlabel {
  grid-column: 1; font-size: .62rem; color: var(--ink-muted); text-align: right;
  font-family: ui-monospace, Menlo, monospace; align-self: center; padding-right: 4px;
}
.heatgrid i.d { aspect-ratio: 1; border-radius: 2px; background: var(--empty); display: block; }
.heatgrid i.d.done { background: var(--done); }
.heatgrid i.d.miss { background: var(--miss); }
.heatgrid i.d.future { background: transparent; box-shadow: inset 0 0 0 1px var(--rule); }
.heatgrid i.d.blank { background: transparent; }

.years { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }
.years button {
  font: inherit; font-size: .8rem; font-family: ui-monospace, Menlo, monospace;
  padding: 5px 12px; border-radius: 7px; cursor: pointer; text-align: right;
  border: 1px solid transparent; background: transparent; color: var(--ink-muted);
}
.years button:hover { background: var(--surface-2); color: var(--ink); }
.years button.on {
  background: var(--surface-2); color: var(--ink); font-weight: 700;
  border-color: var(--rule);
}
@media (max-width: 620px) {
  .heatwrap { flex-direction: column-reverse; }
  .years { flex-direction: row; flex-wrap: wrap; }
}
.legend { display: flex; gap: 14px; align-items: center; font-size: .74rem;
  color: var(--ink-muted); margin-top: 10px; flex-wrap: wrap; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block;
  vertical-align: -2px; margin-right: 5px; }

.note {
  font-size: .75rem; color: var(--ink-muted); line-height: 1.6;
  border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 18px;
}
.empty { padding: 28px; text-align: center; color: var(--ink-muted); font-size: .88rem; }
</style>

<div class="wrap">

  <p class="eyebrow">task_history</p>
  <h1>Consistency</h1>
  <p class="sub">How reliably each task got done, and when it slipped. Days that haven't happened yet are excluded — they aren't misses.</p>

  <div class="strip" id="strip"></div>

  <div class="card">
    <h2>Completion rate by task</h2>
    <div class="body">
      <div class="controls">
        <label for="minocc">Only tasks with at least <b id="minocc-v" class="mono">10</b> scheduled days</label>
        <input type="range" id="minocc" min="1" max="120" value="10" style="flex:1;min-width:140px">
      </div>
      <div class="rank" id="rank"></div>
    </div>
  </div>

  <div class="card">
    <h2>Per task</h2>
    <div class="body">
      <div class="controls">
        <select id="task"></select>
      </div>
      <div class="headline">
        <div><span class="bigpct" id="pct">—</span></div>
        <div class="meta" id="meta"></div>
      </div>
      <div class="strip" id="tstrip" style="margin-top:0"></div>
      <div class="heatwrap">
        <div class="heatscroll"><div class="heatgrid" id="heat" role="img" aria-label="Completion by day"></div></div>
        <div class="years" id="years"></div>
      </div>
      <div class="legend">
        <span><i style="background:var(--done)"></i>Completed</span>
        <span><i style="background:var(--miss)"></i>Missed</span>
        <span><i style="background:var(--empty)"></i>Not scheduled</span>
        <span><i style="background:transparent;box-shadow:inset 0 0 0 1px var(--rule)"></i>Upcoming</span>
      </div>
    </div>
  </div>

  <div class="note" id="note"></div>
</div>

<script id="bootstrap" type="application/json">__BOOTSTRAP__</script>
<script>
(function () {
  var BOOT = JSON.parse(document.getElementById('bootstrap').textContent);
  var DAY = 86400000;
  var MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  /* Local date parts, not UTC: west of UTC the two disagree all evening and
     today would be treated as future. */
  var n = new Date();
  var TODAY = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') +
              '-' + String(n.getDate()).padStart(2, '0');

  var ROWS = [], TITLES = [], byTitle = {};

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function parseDay(s) { var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function fmtDay(t) {
    var d = new Date(t);
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') +
           '-' + String(d.getUTCDate()).padStart(2, '0');
  }
  function pctColour(p) {
    return p >= 80 ? 'var(--done)' : p >= 50 ? 'var(--warn)' : 'var(--miss)';
  }
  function fmtPct(done, total) {
    if (!total) return '—';
    if (done === total) return '100%';
    var p = done / total * 100;
    return Math.min(Math.round(p), 99) + '%';
  }

  /* Longest run, and the run still going as of the most recent scheduled day. */
  function streaks(flags) {
    var longest = 0, run = 0;
    flags.forEach(function (v) { run = v ? run + 1 : 0; longest = Math.max(longest, run); });
    var cur = 0;
    for (var i = flags.length - 1; i >= 0 && flags[i]; i--) cur++;
    return [longest, cur];
  }

  function summary() {
    var past = ROWS.filter(function (r) { return r.day <= TODAY; });
    var done = past.filter(function (r) { return r.is_completed; });
    var perDay = {};
    done.forEach(function (r) { perDay[r.day] = (perDay[r.day] || 0) + 1; });
    var days = Object.keys(perDay);
    var best = days.reduce(function (a, b) {
      return (perDay[b] > (perDay[a] || 0)) ? b : a;
    }, days[0]);
    var avg = days.length ? (done.length / days.length) : 0;

    document.getElementById('strip').innerHTML = [
      cell('Total completed', done.length.toLocaleString()),
      cell('Active days', days.length.toLocaleString()),
      cell('Avg per day', avg.toFixed(1)),
      cell('Best day', best ? perDay[best] + ' tasks' : '—', best || ''),
      cell('Overall rate',
           fmtPct(done.length, past.length),
           past.length.toLocaleString() + ' scheduled'),
    ].join('');
  }
  function cell(lbl, v, sub) {
    return '<div class="cell"><span class="lbl">' + esc(lbl) + '</span>' +
      '<span class="v mono">' + esc(v) + '</span>' +
      (sub ? '<span class="sub2">' + esc(sub) + '</span>' : '') + '</div>';
  }

  function ranking() {
    var min = Number(document.getElementById('minocc').value);
    document.getElementById('minocc-v').textContent = min;
    var stats = TITLES.map(function (t) {
      var past = byTitle[t].filter(function (r) { return r.day <= TODAY; });
      var done = past.filter(function (r) { return r.is_completed; }).length;
      return { title: t, n: past.length, done: done,
               pct: past.length ? done / past.length * 100 : 0 };
    }).filter(function (s) { return s.n >= min; })
      .sort(function (a, b) { return a.pct - b.pct; });   /* worst first */

    document.getElementById('rank').innerHTML = stats.length
      ? stats.map(function (s) {
          return '<div class="row">' +
            '<div class="name"><button type="button" data-t="' + esc(s.title) + '">' +
              esc(s.title) + '</button></div>' +
            '<div class="track"><div class="fill" style="width:' + s.pct.toFixed(1) +
              '%;background:' + pctColour(s.pct) + '"></div></div>' +
            '<div class="num">' + fmtPct(s.done, s.n) + '  ' + s.done + '/' + s.n + '</div>' +
          '</div>';
        }).join('')
      : '<div class="empty">No tasks meet that threshold. Lower the slider.</div>';

    Array.prototype.forEach.call(document.querySelectorAll('.row .name button'), function (b) {
      b.addEventListener('click', function () {
        document.getElementById('task').value = b.dataset.t;
        detail();
      });
    });
  }

  function detail() {
    var t = document.getElementById('task').value;
    var all = byTitle[t] || [];
    var past = all.filter(function (r) { return r.day <= TODAY; });
    past.sort(function (a, b) { return a.day < b.day ? -1 : 1; });

    var flags = past.map(function (r) { return !!r.is_completed; });
    var done = flags.filter(Boolean).length;
    var pct = flags.length ? done / flags.length * 100 : 0;
    var st = streaks(flags);

    var el = document.getElementById('pct');
    el.textContent = fmtPct(done, flags.length);
    el.style.color = pctColour(pct);
    document.getElementById('meta').innerHTML =
      esc(t) + ' — <b>' + done.toLocaleString() + '</b> of <b>' +
      flags.length.toLocaleString() + '</b> scheduled days completed';

    document.getElementById('tstrip').innerHTML = [
      cell('Scheduled', flags.length.toLocaleString()),
      cell('Completed', done.toLocaleString()),
      cell('Missed', (flags.length - done).toLocaleString()),
      cell('Longest streak', st[0] + ' days'),
      cell('Current streak', st[1] + ' days'),
    ].join('');

    heatmap(all);
  }

  /* Which year the grid shows. The current calendar year, not a rolling 365
     days: a window that opens in the middle of last August makes it impossible
     to compare one year with another, which is most of the reason to look.
     Null until the first render chooses. */
  var HEAT_YEAR = null;

  function heatYears(rows) {
    var seen = {};
    rows.forEach(function (r) { seen[r.day.slice(0, 4)] = 1; });
    return Object.keys(seen).sort().reverse();
  }

  /* Columns are Monday-first weeks. A week is filed under the month its Monday
     falls in, which is what lets every label span a whole number of columns and
     sit exactly over them -- the labels are cells of this table, not a separate
     row that could drift out of step with it. */
  function heatmap(rows) {
    var host = document.getElementById('heat');
    var nav = document.getElementById('years');
    if (!rows.length) { host.innerHTML = ''; nav.innerHTML = ''; return; }

    var years = heatYears(rows);
    if (years.indexOf(HEAT_YEAR) === -1) {
      var thisYear = TODAY.slice(0, 4);
      HEAT_YEAR = years.indexOf(thisYear) !== -1 ? thisYear : years[0];
    }

    nav.innerHTML = years.map(function (y) {
      return '<button type="button" data-year="' + y + '"' +
        (y === HEAT_YEAR ? ' class="on" aria-current="true"' : '') + '>' + y + '</button>';
    }).join('');

    var byDay = {};
    rows.forEach(function (r) { byDay[r.day] = r; });

    /* Jan 1 back to its Monday, Dec 31 forward to its Sunday, so the grid is
       whole weeks and every column holds seven cells. */
    var start = parseDay(HEAT_YEAR + '-01-01');
    start -= ((new Date(start).getUTCDay() + 6) % 7) * DAY;
    var end = parseDay(HEAT_YEAR + '-12-31');
    end += (6 - ((new Date(end).getUTCDay() + 6) % 7)) * DAY;

    var weeks = [], months = [], lastMonth = -1;
    for (var ts = start; ts <= end; ts += DAY) {
      var d = new Date(ts);
      if ((d.getUTCDay() + 6) % 7 === 0) {
        weeks.push([]);
        var m = d.getUTCMonth();
        if (String(d.getUTCFullYear()) === HEAT_YEAR && m !== lastMonth) {
          months.push({ m: m, span: 1 });
          lastMonth = m;
        } else if (months.length) {
          months[months.length - 1].span++;
        } else {
          months.push({ m: -1, span: 1 });
        }
      }
      weeks[weeks.length - 1].push(ts);
    }

    /* A one-column stub has no room to print a name in. Fold it into the month
       that follows rather than letting a clipped label sit over the wrong week. */
    if (months.length > 1 && months[0].span === 1) {
      months[1].span += 1;
      months.shift();
    }

    host.style.setProperty('--weeks', weeks.length);

    /* Column 1 is the weekday gutter, so week w sits on line w + 2. Row 1 is
       the month strip; weekday r sits on row r + 2. Everything is placed
       explicitly -- nothing here depends on document order. */
    var out = [], col = 1;
    months.forEach(function (x) {
      out.push('<div class="mlabel" style="grid-column:' + (col + 1) +
        ' / span ' + x.span + '">' + (x.m < 0 ? '' : MO[x.m]) + '</div>');
      col += x.span;
    });

    var DOW = ['Mon', '', 'Wed', '', 'Fri', '', ''];
    for (var row = 0; row < 7; row++) {
      if (DOW[row]) {
        out.push('<div class="dlabel" style="grid-row:' + (row + 2) + '">' + DOW[row] + '</div>');
      }
      for (var w = 0; w < weeks.length; w++) {
        var ts = weeks[w][row];
        var key = ts === undefined ? '' : fmtDay(ts);
        var pos = 'grid-column:' + (w + 2) + ';grid-row:' + (row + 2);
        /* Pad days at either end belong to the neighbouring year. Their cells
           stay, blank, so the columns keep their shape. */
        if (!key || key.slice(0, 4) !== HEAT_YEAR) {
          out.push('<i class="d blank" style="' + pos + '"></i>');
          continue;
        }
        var r = byDay[key];
        var cls = !r ? '' : (key > TODAY ? 'future' : (r.is_completed ? 'done' : 'miss'));
        var label = r
          ? key + (key > TODAY ? ' — upcoming' : (r.is_completed ? ' — completed' : ' — missed'))
          : key + ' — not scheduled';
        out.push('<i class="d ' + cls + '" style="' + pos + '" title="' + esc(label) + '"></i>');
      }
    }
    host.innerHTML = out.join('');
  }

  document.getElementById('years').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-year]');
    if (!b || b.dataset.year === HEAT_YEAR) return;
    HEAT_YEAR = b.dataset.year;
    heatmap(byTitle[document.getElementById('task').value] || []);
  });

  document.getElementById('minocc').addEventListener('input', ranking);
  document.getElementById('task').addEventListener('change', detail);

  /* Inline: the server already had the rows and embedded them, so there is no
     second round trip and nothing to show a loading state for. Live: fetch.
     Both paths reach the same handler. */
  (BOOT.mode === 'live'
    ? fetch(BOOT.endpoint, { headers: BOOT.headers || {} })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    : Promise.resolve(BOOT.data))
    .then(function (data) {
      /* Daily only. One-off tasks from other lists have no meaningful rate. */
      ROWS = data.filter(function (r) { return r.list_title === 'Daily'; });
      ROWS.forEach(function (r) {
        (byTitle[r.title] = byTitle[r.title] || []).push(r);
      });
      TITLES = Object.keys(byTitle).sort();

      document.getElementById('task').innerHTML = TITLES.map(function (t) {
        return '<option>' + esc(t) + '</option>';
      }).join('');

      var future = ROWS.filter(function (r) { return r.day > TODAY; }).length;
      document.getElementById('note').innerHTML =
        '<b>Read-only.</b> ' + ROWS.length.toLocaleString() +
        ' Daily records from <span class="mono">task_history</span>. ' +
        future.toLocaleString() + ' fall after today and are excluded from every ' +
        'rate and streak above — a day that has not happened cannot be a miss.';

      summary();
      ranking();
      detail();
    })
    .catch(function (e) {
      document.getElementById('rank').innerHTML =
        '<div class="empty">Could not load: ' + esc(e.message) + '</div>';
    });
})();
</script>
