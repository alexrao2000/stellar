<title>Today</title>
<style>
:root {
  --bg: #EFEEF4; --surface: #FCFBFE; --surface-2: #F4F2F9;
  --ink: #191627; --ink-muted: #6A6480; --rule: #DCD8E6;
  --done-bg: #EDEAF4; --done-ink: #8B84A6;
  --todo-bg: #6D4AC4; --todo-ink: #FFFFFF;
  --ok: #2F6B4F; --warn: #8A5A00; --bad: #A33A28;
  --shadow: 0 1px 2px rgba(25,22,39,.06), 0 2px 8px rgba(25,22,39,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131019; --surface: #1B1826; --surface-2: #232032;
    --ink: #EBE8F5; --ink-muted: #948DAD; --rule: #2E2A3D;
    --done-bg: #221E30; --done-ink: #7B7496;
    --todo-bg: #8B63E8; --todo-ink: #120E1C;
    --ok: #6FBF95; --warn: #E8B85C; --bad: #E3806B;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #131019; --surface: #1B1826; --surface-2: #232032;
  --ink: #EBE8F5; --ink-muted: #948DAD; --rule: #2E2A3D;
  --done-bg: #221E30; --done-ink: #7B7496;
  --todo-bg: #8B63E8; --todo-ink: #120E1C;
  --ok: #6FBF95; --warn: #E8B85C; --bad: #E3806B;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.3);
}
:root[data-theme="light"] {
  --bg: #EFEEF4; --surface: #FCFBFE; --surface-2: #F4F2F9;
  --ink: #191627; --ink-muted: #6A6480; --rule: #DCD8E6;
  --done-bg: #EDEAF4; --done-ink: #8B84A6;
  --todo-bg: #6D4AC4; --todo-ink: #FFFFFF;
  --ok: #2F6B4F; --warn: #8A5A00; --bad: #A33A28;
  --shadow: 0 1px 2px rgba(25,22,39,.06), 0 2px 8px rgba(25,22,39,.04);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.mono {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
}
/* Phone-first: this is used standing in a bathroom, not at a desk. */
.wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }

header { margin-bottom: 18px; }
.eyebrow {
  font-family: ui-monospace, Menlo, monospace; font-size: .66rem;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 6px;
}
h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -.02em; margin: 0; }
.daynav { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.daynav2 { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.date { color: var(--ink); font-size: .95rem; font-weight: 600; flex: 1; text-align: center; }
.step {
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  min-width: 44px; height: 40px; border-radius: 9px; cursor: pointer;
  font: inherit; font-size: 1.05rem; flex: 0 0 auto;
}
.step.wide { min-width: 0; padding: 0 14px; font-size: .84rem; font-weight: 600; }
.step:hover { background: var(--surface-2); }
.daynav2 input[type="date"] {
  flex: 1; min-width: 0; font: inherit; font-size: .9rem; padding: 9px 10px;
  border-radius: 9px; border: 1px solid var(--rule);
  background: var(--surface); color: var(--ink);
  font-family: ui-monospace, Menlo, monospace;
}

.card {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px;
}
.card h2 {
  font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-muted); margin: 0; padding: 11px 14px;
  border-bottom: 1px solid var(--rule); background: var(--surface-2);
}
.body { padding: 10px; display: flex; flex-direction: column; gap: 6px; }

/* Tap targets sized for a thumb, not a cursor. */
.task {
  display: flex; align-items: center; gap: 12px; width: 100%;
  border: none; font: inherit; font-size: .96rem; text-align: left;
  padding: 14px 12px; border-radius: 8px; cursor: pointer;
  background: var(--todo-bg); color: var(--todo-ink); font-weight: 600;
  transition: background .12s, color .12s;
}
.task.done { background: var(--done-bg); color: var(--done-ink); font-weight: 400; }
/* Strike the title, not the tile: a decoration on the tile would run through
   everything inside it, and a descendant cannot cancel an inherited one. */
.task.done .ttl {
  text-decoration: line-through;
  text-decoration-color: color-mix(in srgb, var(--done-ink) 55%, transparent);
}
.task:disabled { opacity: .5; }
.read-only .task:disabled { opacity: 1; cursor: default; }
/* The input dims on a read-only day; the unit sits outside it and would
   otherwise stay at full strength beside a faded number. */
.read-only .field .unit { opacity: .6; }
.read-only #status { color: var(--ink-muted); }
.box {
  width: 20px; height: 20px; border-radius: 5px; flex: 0 0 auto;
  border: 2px solid currentColor; display: flex; align-items: center; justify-content: center;
}
.task.done .box, .field.done .box { background: var(--done-ink); border-color: var(--done-ink); }
.task.done .box::after, .field.done .box::after {
  content: ""; width: 9px; height: 5px;
  border-left: 2px solid var(--surface); border-bottom: 2px solid var(--surface);
  transform: rotate(-45deg) translate(0, -1px);
}
.task .ttl { flex: 1; }

/* Every entry -- measurement or task -- is a tile with a drag handle beside
   it. The handle sits outside the tile so tapping a tile still ticks it and a
   field can still be typed in; only the handle moves things. */
.item { display: flex; gap: 6px; align-items: stretch; }
.item > .task, .item > .field { flex: 1; min-width: 0; }
.grip {
  flex: 0 0 30px; display: flex; align-items: center; justify-content: center;
  border: none; background: transparent; color: var(--ink-muted); padding: 0;
  border-radius: 8px; cursor: grab; touch-action: none;
}
.grip svg { fill: currentColor; }
.grip:hover { background: var(--surface-2); color: var(--ink); }
.item.dragging { position: relative; z-index: 1; }
.item.dragging > .task, .item.dragging > .field {
  box-shadow: 0 6px 18px rgba(25, 22, 39, .22);
}
body.reordering, body.reordering * { cursor: grabbing !important; user-select: none; }

/* A measurement is its own task: the field is the tile. Solid like an open
   task until the reading is in, then faded like a done one. With no task for
   the day at all (an old day before it was tracked) it stays neutral, since
   purple would claim something was due. Same geometry in every state, so
   filling a field never shifts the layout. */
.field {
  display: flex; gap: 12px; align-items: center;
  padding: 6px 12px; border-radius: 8px;
  transition: background .12s, color .12s;
}
.field label {
  font-size: .76rem; color: var(--ink-muted); min-width: 84px;
  font-family: ui-monospace, Menlo, monospace; text-transform: uppercase; letter-spacing: .06em;
}
.field .box { display: none; }
.field.todo, .field.done { cursor: text; }
.field.todo .box, .field.done .box { display: flex; }
.field.todo { background: var(--todo-bg); color: var(--todo-ink); }
.field.todo label { color: var(--todo-ink); font-weight: 600; }
.field.done { background: var(--done-bg); color: var(--done-ink); }
.field.done label {
  color: var(--done-ink);
  text-decoration: line-through;
  text-decoration-color: color-mix(in srgb, var(--done-ink) 55%, transparent);
}
.field.done input { color: var(--done-ink); background: var(--surface); }
.weight-label { display: flex; align-items: center; gap: 5px; }
.weight-warning {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; color: var(--warn); cursor: help;
  font-family: system-ui, sans-serif; font-size: .9rem; line-height: 1;
}
.weight-warning[hidden] { display: none; }
.weight-warning:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; border-radius: 3px; }
.weight-warning-tip {
  position: absolute; z-index: 20; left: -65px; top: calc(100% + 8px);
  width: min(300px, calc(100vw - 48px)); padding: 8px 10px;
  border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--rule));
  border-radius: 7px; background: var(--surface); color: var(--ink);
  box-shadow: var(--shadow); font-family: system-ui, sans-serif;
  font-size: .76rem; font-weight: 500; line-height: 1.35;
  letter-spacing: 0; text-transform: none; visibility: hidden; opacity: 0;
  transform: translateY(3px); transition: opacity .12s, transform .12s;
  pointer-events: none;
}
.weight-warning:hover .weight-warning-tip,
.weight-warning:focus .weight-warning-tip {
  visibility: visible; opacity: 1; transform: translateY(0);
}
/* The unit rides inside the box, against its right edge, so it reads as part
   of the value rather than as a stray word at the far end of the row. */
.field .withunit { flex: 1; min-width: 0; position: relative; display: flex; }
.field .withunit input { padding-right: 44px; }
.field .unit {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  pointer-events: none; font-size: .84rem; color: var(--ink-muted);
  font-family: ui-monospace, Menlo, monospace;
}
.field input {
  flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; padding: 11px 12px;
  border-radius: 8px; border: 1px solid var(--rule);
  background: var(--bg); color: var(--ink);
  font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums;
}
.field input:disabled { opacity: .6; }
/* The only in-flight cue now that the Save buttons are gone. Deliberately
   quiet: a spinner on a field you have already moved on from reads as an
   error. */
.field input.saving { border-color: var(--todo-bg); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--todo-bg); outline-offset: 2px; }
.field.todo input:focus-visible { outline-color: var(--todo-ink); }

#status {
  margin-top: 14px; font-size: .82rem; min-height: 1.3em;
  font-family: ui-monospace, Menlo, monospace;
}
#status.ok { color: var(--ok); }
#status.bad { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Task Tracker</p>
    <h1>Today</h1>
    <div class="daynav">
      <button class="step" id="prev-day" type="button" aria-label="Previous day">&larr;</button>
      <div class="date mono" id="date"></div>
      <button class="step" id="next-day" type="button" aria-label="Next day">&rarr;</button>
    </div>
    <div class="daynav2">
      <input type="date" id="pick" aria-label="Jump to a date">
      <button class="step wide" id="go-today" type="button">Today</button>
    </div>
  </header>

  <div class="card">
    <h2>Tasks</h2>
    <div class="body" id="tasks">
      <div class="item" id="item-weight">
        <div class="field" id="field-weight">
          <span class="box" aria-hidden="true"></span>
          <label for="weight" class="weight-label">Weight
            <span id="weight-warning" class="weight-warning" role="img" tabindex="0" hidden
                  aria-describedby="weight-warning-tip">&#9888;
              <span id="weight-warning-tip" class="weight-warning-tip" role="tooltip"></span>
            </span>
          </label>
          <div class="withunit">
            <input id="weight" type="number" inputmode="decimal" step="0.1" placeholder="0.0">
            <span class="unit" aria-hidden="true">lbs</span>
          </div>
        </div>
      </div>
      <div class="item" id="item-wake">
        <div class="field" id="field-wake">
          <span class="box" aria-hidden="true"></span>
          <label for="wake">Wake up</label>
          <input id="wake" type="time">
        </div>
      </div>
    </div>
  </div>

  <div id="status"></div>
</div>

<script id="bootstrap" type="application/json">__BOOTSTRAP__</script>
<script>
(function () {
  var BOOT = JSON.parse(document.getElementById('bootstrap').textContent);
  var DAY = BOOT.day;
  var MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function parts(day) { return day.split('-').map(Number); }
  function shiftDay(day, n) {
    var q = parts(day);
    var x = new Date(Date.UTC(q[0], q[1] - 1, q[2]) + n * 86400000);
    return x.getUTCFullYear() + '-' +
      String(x.getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(x.getUTCDate()).padStart(2, '0');
  }
  /* The floor travels with the page, so writability is decided here rather
     than fetched -- which is what lets a day change stay client-side. */
  function writable(day) { return day >= BOOT.floor; }

  function paintHeader(day) {
    var q = parts(day);
    var dd = new Date(Date.UTC(q[0], q[1] - 1, q[2]));
    document.getElementById('date').textContent =
      WD[dd.getUTCDay()] + ', ' + MO[q[1] - 1] + ' ' + q[2] + ', ' + q[0];
    document.getElementById('pick').value = day;
  }

  var CACHE = {};
  var pending = {};

  /* The list order, as titles: what the server says, plus any drag made here
     since. Kept locally so a day painted from the cache comes out in the new
     order straight away rather than in the old one and then jumping. Not under
     the td: prefix, which is pruned as a set of days. */
  var ORDER_KEY = 'task-order';
  var ORDER = (function () {
    try { return JSON.parse(localStorage.getItem(ORDER_KEY)) || []; }
    catch (e) { return []; }
  })();
  /* Bumped by every local reorder. A read that started before one must not
     teach us the order it replaced. */
  var orderVersion = 0;

  function setOrder(order) {
    ORDER = order;
    try { localStorage.setItem(ORDER_KEY, JSON.stringify(order)); } catch (e) { /* fine */ }
  }

  /* Lay `sub` -- the titles one day shows, in its order -- over `base`. Titles
     the day does not show keep their places, so learning from or dragging on a
     day that lacks some task never loses that task's position. */
  function mergeOrder(base, sub) {
    var inSub = {}, known = {};
    sub.forEach(function (t) { inSub[t] = true; });
    base.forEach(function (t) { known[t] = true; });
    var out = base.slice(), slots = [];
    out.forEach(function (t, i) { if (inSub[t]) slots.push(i); });
    var placed = sub.filter(function (t) { return known[t]; });
    slots.forEach(function (s, k) { out[s] = placed[k]; });
    sub.forEach(function (t) { if (!known[t]) out.push(t); });
    return out;
  }
  /* Per day: true = every recurring task already has a row, so the ensure POST
     has nothing to do. Undefined means the server did not say. */
  var complete = {};

  /* Last known rows per day, surviving reload and reboot. This is what makes
     the page paint instantly instead of waiting out a cold start. It is a
     cache, never the truth -- every day painted from it is re-read from the
     server immediately, and the indicator says so until that lands. */
  var STORE = 'td:', STORE_KEEP = 120;

  function storeRead(day) {
    try {
      var raw = localStorage.getItem(STORE + day);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }             // private mode, or disabled
  }

  function storeWrite(day, rows) {
    try {
      localStorage.setItem(STORE + day, JSON.stringify(rows));
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(STORE) === 0) keys.push(k);
      }
      /* ISO dates sort lexically, so the oldest are simply the first. */
      if (keys.length > STORE_KEEP) {
        keys.sort().slice(0, keys.length - STORE_KEEP).forEach(function (k) {
          localStorage.removeItem(k);
        });
      }
    } catch (e) { /* quota or private mode -- the app is fine without it */ }
  }

  var requestVersion = {};
  var ensured = {};

  function fetchDay(day, fresh) {
    if (!fresh && CACHE[day]) return Promise.resolve(CACHE[day]);
    var key = day + (fresh ? ':fresh' : ':cached');
    if (pending[key]) return pending[key];
    var version = (requestVersion[day] || 0) + 1;
    requestVersion[day] = version;
    var orderAtStart = orderVersion;
    pending[key] = fetch('/api/day/' + day + (fresh ? '?fresh=true' : ''),
                         fresh ? { cache: 'no-store' } : {})
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        /* The read already knows whether this day still needs materialising.
           Absent header means the server could not say, and we leave `complete`
           undefined so the ensure below still runs. */
        var flag = r.headers.get('X-Day-Complete');
        if (flag === '1') complete[day] = true;
        else if (flag === '0') complete[day] = false;
        return r.json();
      })
      .then(function (rows) {
        delete pending[key];
        /* A slow background prefetch must never replace a newer live read. */
        if (requestVersion[day] === version) {
          CACHE[day] = rows;
          storeWrite(day, rows);
        }
        /* The server's order, learned from a live read of a current day that
           has both measurements -- an old day lists tasks that no longer run,
           and a not-yet-filled day lists none. Skipped if a reorder happened
           here since the request left, or one is still being saved. */
        var titles = rows.map(function (r) { return r.title; });
        if (fresh && writable(day) && orderAtStart === orderVersion && !orderSaving &&
            titles.indexOf(WEIGH) >= 0 && titles.indexOf(WAKE) >= 0) {
          setOrder(mergeOrder(ORDER, titles));
        }
        return rows;
      }, function (e) { delete pending[key]; throw e; });
    return pending[key];
  }

  function showDay(day, opts) {
    opts = opts || {};
    DAY = day;
    paintHeader(day);
    if (!opts.pop) {
      history[opts.replace ? 'replaceState' : 'pushState'](
        { day: day }, '', '/today?day=' + day);
    }

    var ro = !writable(day);
    document.body.classList.toggle('read-only', ro);
    ['weight', 'wake'].forEach(function (id) {
      document.getElementById(id).disabled = ro;
    });
    say(ro ? 'Read-only: ' + day + ' is before ' + BOOT.floor +
             ', the reconciled history.' : '');

    /* Paint what we already know before touching the network. On a warm
       instance the confirmation lands in tens of ms and nothing visibly
       happens; on a cold one the day is readable while the server boots. */
    var known = CACHE[day] || storeRead(day);
    var knownJson = known ? JSON.stringify(known) : null;
    render(known || []);

    /* Confirm against the server behind the paint. Not announced: the check
       is for the page's benefit, and a label flashing on every day change is
       noise. A real difference repaints; a failure says so below. */
    return fetchDay(day, true).then(function (rows) {
      if (DAY !== day) return;                   // stepped past it while loading
      /* Only repaint on a real difference. Re-rendering identical rows would
         throw away focus and any half-typed measurement to show the same
         thing, which is exactly the flicker this is meant to remove. */
      if (JSON.stringify(rows) !== knownJson) render(rows);
      scheduleEnsure(day);
      prefetchAdjacent(day);
    }).catch(function (e) {
      /* With a local copy on screen this is a stale-data warning, not a
         failure: say which it is rather than blaming the rows on display. */
      say(known ? 'Showing the last known copy: ' + e.message
                : 'Could not load: ' + e.message, true);
    });
  }

  function prefetchAdjacent(day) {
    [shiftDay(day, -1), shiftDay(day, 1)].forEach(function (d) {
      if (!CACHE[d]) fetchDay(d, false);
    });
  }

  /* Materialising is a write, and switching days is now instant, so it waits
     for the day to be settled on rather than merely passed through. Without
     this, holding an arrow key would create rows for every day it swept over
     -- and pre-created future rows are precisely what the calendar shows as a
     wall of misses later. */
  var ensureTimer = null;
  function scheduleEnsure(day) {
    clearTimeout(ensureTimer);
    if (!writable(day) || ensured[day]) return;
    /* Nothing missing -- and the read that just landed said so, at no cost.
       Materialising here would be a write round trip that inserts nothing,
       which is what it had been doing on every day opened. */
    if (complete[day]) { ensured[day] = true; return; }
    ensureTimer = setTimeout(function () {
      if (DAY !== day) return;
      post('/api/day/' + day + '/ensure')
        .then(function (result) {
          ensured[day] = true;
          if (!result.created || !result.created.length) return null;
          delete CACHE[day];                     // newly materialised rows
          return fetchDay(day, true);
        })
        .then(function (rows) { if (rows && DAY === day) render(rows); })
        .catch(function (e) { say(e.message, true); });
    }, 400);
  }

  document.getElementById('prev-day').addEventListener('click', function () {
    showDay(shiftDay(DAY, -1));
  });
  document.getElementById('next-day').addEventListener('click', function () {
    showDay(shiftDay(DAY, 1));
  });
  document.getElementById('pick').addEventListener('change', function (e) {
    if (e.target.value) showDay(e.target.value);
  });
  document.getElementById('go-today').addEventListener('click', function () {
    showDay(BOOT.today);
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') showDay(shiftDay(DAY, -1));
    if (e.key === 'ArrowRight') showDay(shiftDay(DAY, 1));
  });
  window.addEventListener('popstate', function (e) {
    var day = (e.state && e.state.day) || BOOT.day;
    showDay(day, { pop: true });
  });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function say(msg, bad) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = !msg ? '' : (bad ? 'bad' : 'ok');
  }
  function weightWarning(msg) {
    var icon = document.getElementById('weight-warning');
    var tip = document.getElementById('weight-warning-tip');
    icon.hidden = !msg;
    tip.textContent = msg || '';
    icon.setAttribute('aria-label', msg ? 'Weight warning: ' + msg : '');
  }
  function setDone(el, done) { el.classList.toggle('done', done); }

  /* One reader for the wake-up note, used by both the input prefill and the
     row read-out. `value` is what <input type=time> wants; `display` is what
     reads naturally beside the task. */
  function wakeFromNotes(notes) {
    if (!notes) return null;
    var m = /(\d{1,2}):(\d{2})\s*([AaPp][Mm])/.exec(notes);
    if (!m) return null;
    var h = Number(m[1]) % 12;
    if (m[3].toLowerCase() === 'pm') h += 12;
    return {
      value: String(h).padStart(2, '0') + ':' + m[2],
      display: (h % 12 || 12) + ':' + m[2] + ' ' + (h < 12 ? 'am' : 'pm')
    };
  }

  var writesInFlight = 0;

  function post(url, body) {
    writesInFlight++;
    var settled = function () { writesInFlight--; };
    var opts = { method: 'POST' };
    if (body !== undefined) {
      opts.headers = { 'Content-Type': 'application/json' };
      opts.body = JSON.stringify(body);
    }
    return fetch(url, opts).then(function (res) {
      if (res.ok) return res.json();
      return res.json().catch(function () { return {}; }).then(function (j) {
        throw new Error(j.detail || ('HTTP ' + res.status));
      });
    }).then(
      function (v) { settled(); return v; },
      function (e) { settled(); throw e; }
    );
  }

  var WEIGH = 'Weigh yourself', WAKE = 'Wake Up';

  /* A measurement field's tile: 'todo' while the reading is due, 'done' once
     it is in, '' when the day has no such task. */
  function setTile(id, state) {
    var tile = document.getElementById('field-' + id);
    tile.classList.toggle('todo', state === 'todo');
    tile.classList.toggle('done', state === 'done');
  }
  function tileState(id) {
    var tile = document.getElementById('field-' + id);
    return tile.classList.contains('done') ? 'done'
         : tile.classList.contains('todo') ? 'todo' : '';
  }
  /* Clicking anywhere on the tile goes to its input, as tapping a task does. */
  ['weight', 'wake'].forEach(function (id) {
    document.getElementById('field-' + id).addEventListener('click', function (e) {
      var input = document.getElementById(id);
      if (e.target === input || input.disabled) return;
      input.focus();
      if (id === 'wake' && input.showPicker) {
        try { input.showPicker(); } catch (err) { /* not a user gesture */ }
      }
    });
  });

  function render(rows) {
    var host = document.getElementById('tasks');
    /* Drop the last day's task entries. The two measurement entries are
       permanent nodes and stay put: removing one would blur a field being
       typed in, and blur saves. */
    Array.prototype.slice.call(host.querySelectorAll('.item.task-item'))
      .forEach(function (n) { n.remove(); });
    var entries = [], seen = {};
    /* Reset before each day. The prefill below only writes when the day has a
       value, so on a day without one the previous day's reading would sit in
       the box -- and `saved` would suppress the save that corrects it.

       A field being typed in is left alone. render() is no longer only a day
       change: a save confirmation and the background revalidation both reach
       here, and either one clearing the box mid-entry looks exactly like the
       app eating your input. */
    ['weight', 'wake'].forEach(function (id) {
      setTile(id, '');
      var el = document.getElementById(id);
      if (document.activeElement === el) return;
      el.value = '';
      saved[id] = null;
    });
    weightWarning('');
    rows.forEach(function (r) {
      /* These two are readings, not checkboxes, and their field is their
         tile -- a second tile in Tasks would only repeat it. Prefill from what
         is recorded, so a re-save shows the current value, not an empty box. */
      if (r.title === WEIGH) {
        entries.push({ title: r.title, node: document.getElementById('item-weight'), seq: entries.length });
        seen.weight = true;
        setTile('weight', r.is_completed ? 'done' : 'todo');
        if (r.weight_lbs !== null && r.weight_lbs !== undefined) {
          var wEl = document.getElementById('weight');
          if (document.activeElement !== wEl) {
            wEl.value = Number(r.weight_lbs).toFixed(1);
            saved.weight = wEl.value;
          }
        }
        return;
      }
      if (r.title === WAKE) {
        entries.push({ title: r.title, node: document.getElementById('item-wake'), seq: entries.length });
        seen.wake = true;
        setTile('wake', r.is_completed ? 'done' : 'todo');
        var w = wakeFromNotes(r.notes);
        var kEl = document.getElementById('wake');
        if (w && document.activeElement !== kEl) {
          kEl.value = w.value;
          saved.wake = w.value;
        }
        return;
      }

      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'task' + (r.is_completed ? ' done' : '');
      b.innerHTML = '<span class="box"></span><span class="ttl">' + esc(r.title) + '</span>';
      if (!BOOT.writable) {
        b.disabled = true;
        b.style.cursor = 'default';
        b.style.opacity = '1';
      }
      /* Optimistic: flip the tile now, confirm in the background. A write is
         ~160ms and re-reading the day was another ~200ms, so waiting for both
         meant a third of a second of spinner on every tap. Rapid taps update
         the desired state immediately and are serialized below. */
      function syncDesired() {
        var sent = r.is_completed;
        b.dataset.syncing = '1';
        post('/api/task/' + r.id + '/toggle?done=' + sent)
          .then(function (updated) {
            if (updated && updated.weight_lbs !== undefined) r.weight_lbs = updated.weight_lbs;
          })
          .catch(function (e) {
            /* If the user clicked again, preserve that newer desired state and
               let the next request retry it. Only revert when this request
               still represents the visible state. */
            if (r.is_completed === sent) {
              r.is_completed = !sent;
              setDone(b, !sent);
              say(e.message, true);
            }
          })
          .then(function () {
            if (r.is_completed !== sent) {
              syncDesired();
              return;
            }
            delete b.dataset.syncing;
            storeWrite(DAY, rows);
            say(r.title + (sent ? ' done' : ' un-done'));
          });
      }

      b.addEventListener('click', function () {
        if (!BOOT.writable) return;
        var next = !r.is_completed;
        r.is_completed = next;
        setDone(b, next);
        if (!b.dataset.syncing) syncDesired();
      });
      var item = document.createElement('div');
      item.className = 'item task-item';
      item.dataset.title = r.title;
      item.appendChild(b);
      item.appendChild(makeGrip(r.title));
      entries.push({ title: r.title, node: item, seq: entries.length });
    });

    /* A day without a measurement task -- before it was tracked -- still
       shows the field, neutral, where the order puts it. */
    if (!seen.weight) entries.push({ title: WEIGH, node: document.getElementById('item-weight'), seq: -2 });
    if (!seen.wake) entries.push({ title: WAKE, node: document.getElementById('item-wake'), seq: -1 });

    var rank = {};
    ORDER.forEach(function (t, i) { rank[t] = i; });
    entries.sort(function (a, b) {
      var ra = a.title in rank ? rank[a.title] : Infinity;
      var rb = b.title in rank ? rank[b.title] : Infinity;
      return ra !== rb ? (ra < rb ? -1 : 1) : a.seq - b.seq;
    });
    arrange(host, entries.map(function (e) { return e.node; }));
  }

  /* Put `nodes` in order without ever moving the one holding focus. Moving a
     focused node blurs it, and a blurred measurement field saves whatever is
     half-typed in it -- so everything else moves around it instead. */
  function arrange(host, nodes) {
    var anchor = null;
    nodes.forEach(function (n) { if (n.contains(document.activeElement)) anchor = n; });
    if (!anchor) {
      nodes.forEach(function (n, i) {
        if (host.children[i] !== n) host.insertBefore(n, host.children[i] || null);
      });
      return;
    }
    var k = nodes.indexOf(anchor), ref = anchor;
    nodes.slice(0, k).forEach(function (n) { host.insertBefore(n, anchor); });
    nodes.slice(k + 1).forEach(function (n) { host.insertBefore(n, ref.nextSibling); ref = n; });
  }

  var GRIP = '<svg width="12" height="18" viewBox="0 0 12 18" aria-hidden="true" focusable="false">' +
    '<circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/>' +
    '<circle cx="3" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/>' +
    '<circle cx="3" cy="15" r="1.6"/><circle cx="9" cy="15" r="1.6"/></svg>';

  function makeGrip(title) {
    var g = document.createElement('button');
    g.type = 'button';
    g.className = 'grip';
    g.setAttribute('aria-label', 'Move ' + title + ' (arrow keys)');
    g.innerHTML = GRIP;
    return g;
  }

  /* ---- reordering --------------------------------------------------------
     Drag a handle, by mouse or touch; or focus one and use the arrow keys. The
     list rearranges as you go and the new order is saved when you let go. */
  var orderSaving = false, orderTimer = null;

  function shownOrder() {
    return Array.prototype.map.call(
      document.querySelectorAll('#tasks > .item'), function (n) { return n.dataset.title; });
  }

  function saveOrder() {
    clearTimeout(orderTimer);
    orderVersion++;
    setOrder(mergeOrder(ORDER, shownOrder()));
    orderSaving = true;
    post('/api/task_order', { titles: ORDER })
      .catch(function (e) { say('Could not save the order: ' + e.message, true); })
      .then(function () { orderSaving = false; });
  }
  function saveOrderSoon() {
    clearTimeout(orderTimer);
    orderVersion++;
    orderTimer = setTimeout(saveOrder, 600);
  }

  (function () {
    var host = document.getElementById('tasks');
    document.getElementById('item-weight').dataset.title = WEIGH;
    document.getElementById('item-wake').dataset.title = WAKE;
    document.getElementById('item-weight').appendChild(makeGrip(WEIGH));
    document.getElementById('item-wake').appendChild(makeGrip(WAKE));

    var drag = null;
    function move(e) {
      var item = drag.item, before = null;
      var others = Array.prototype.filter.call(host.children, function (n) { return n !== item; });
      for (var i = 0; i < others.length; i++) {
        var r = others[i].getBoundingClientRect();
        if (e.clientY < r.top + r.height / 2) { before = others[i]; break; }
      }
      if (item.nextElementSibling !== before) {
        host.insertBefore(item, before);
        drag.moved = true;
      }
    }
    function end() {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', end);
      window.removeEventListener('pointercancel', end);
      drag.item.classList.remove('dragging');
      document.body.classList.remove('reordering');
      if (drag.moved) saveOrder();
      drag = null;
    }
    host.addEventListener('pointerdown', function (e) {
      var grip = e.target.closest && e.target.closest('.grip');
      if (!grip || e.button > 0 || drag) return;
      e.preventDefault();
      drag = { item: grip.closest('.item'), moved: false };
      drag.item.classList.add('dragging');
      document.body.classList.add('reordering');
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', end);
      window.addEventListener('pointercancel', end);
    });
    host.addEventListener('keydown', function (e) {
      var grip = e.target.closest && e.target.closest('.grip');
      if (!grip || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
      e.preventDefault();
      var item = grip.closest('.item');
      if (e.key === 'ArrowUp' && item.previousElementSibling) {
        host.insertBefore(item, item.previousElementSibling);
        grip.focus();
      } else if (e.key === 'ArrowDown' && item.nextElementSibling) {
        host.insertBefore(item.nextElementSibling, item);
      } else {
        return;
      }
      saveOrderSoon();
    });
  })();

  /* After a write the cached copy of the day is stale, so drop it and let
     fetchDay repopulate. The rest of the window is untouched. */
  function load() {
    var day = DAY;
    delete CACHE[day];
    return fetchDay(day, true).then(function (rows) {
      if (DAY === day) render(rows);
    });
  }

  /* Both fields save themselves on `change` -- which on these inputs means
     blur or Enter, i.e. when you are done with the field.

     Not a debounce on `input`. A debounce fires on any typing pause, so
     entering 146.8 posts "1", "14", "146" on the way, and each accepted one
     calls load() -> render(), which writes a formatted value straight into
     the box you are still typing in. That is where the stray ".0" came from.
     No delay is short enough to fix this: the problem is writing to a field
     under the cursor, not how long you wait first. */
  var saved = { weight: null, wake: null };

  function autosave(id, build, describe) {
    var el = document.getElementById(id);

    function save() {
      var v = el.value;
      if (!v || v === saved[id]) return;      // cleared, or nothing changed
      var was = tileState(id);
      /* A measurement resolves its task by definition. Show that result at
         input speed; Vercel's write plus confirmation read can take long
         enough for a network-gated checkmark to feel broken. */
      setTile(id, 'done');
      el.classList.add('saving');
      post(build(v))
        .then(function (result) {
          saved[id] = v;
          return load().then(function () {      // reflects the auto-completion
            if (id === 'weight') weightWarning(result.warning || '');
            say(describe(v));
          });
        })
        .catch(function (e) {
          setTile(id, was);
          say(e.message, true);
        })
        .then(function () { el.classList.remove('saving'); });
    }

    el.addEventListener('change', save);
  }

  autosave('weight',
    function (v) { return '/api/day/' + DAY + '/weight?lbs=' + encodeURIComponent(v); },
    function (v) { return 'Weight saved: ' + Number(v).toFixed(1) + ' lbs'; });

  autosave('wake',
    function (v) { return '/api/day/' + DAY + '/wake?time=' + encodeURIComponent(v); },
    function (v) { return 'Wake-up saved: ' + v; });

  /* Re-read the day on the quiet, and repaint only if the server disagrees.
     Without this the page is correct when opened and drifts from then on --
     which is exactly how it felt stale on a second computer.

     No "checking..." here: that indicator is for a reader waiting on a first
     paint, and blinking it every minute would be noise. A change that does
     land is announced, because content rearranging itself in silence is the
     thing that felt broken. */
  var POLL_MS = 60000;

  function revalidate() {
    if (document.hidden || writesInFlight) return;
    var day = DAY;
    var before = CACHE[day] ? JSON.stringify(CACHE[day]) : null;
    fetchDay(day, true).then(function (rows) {
      if (DAY !== day || !before) return;
      if (JSON.stringify(rows) !== before) {
        render(rows);
        say('Updated');
      }
    }).catch(function () { /* keep showing what we have */ });
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) revalidate();
  });
  window.addEventListener('focus', revalidate);
  setInterval(revalidate, POLL_MS);

  /* showDay handles read-only, materialising and the window; the first call
     just points it at the day the server rendered. replace rather than push so
     the entry the browser already has is not duplicated. */
  showDay(DAY, { replace: true });
})();
</script>
