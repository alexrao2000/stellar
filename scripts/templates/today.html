<title>Tasks</title>
<style>
:root {
  --bg: #EFEEF4; --surface: #FCFBFE; --surface-2: #F4F2F9;
  --ink: #191627; --ink-muted: #6A6480; --rule: #DCD8E6;
  --done-bg: #EDEAF4; --done-ink: #8B84A6;
  --todo-bg: #6D4AC4; --todo-ink: #FFFFFF;
  --opt-bg: #2563C9; --opt-ink: #FFFFFF;
  --ok: #2F6B4F; --warn: #8A5A00; --bad: #A33A28;
  --shadow: 0 1px 2px rgba(25,22,39,.06), 0 2px 8px rgba(25,22,39,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131019; --surface: #1B1826; --surface-2: #232032;
    --ink: #EBE8F5; --ink-muted: #948DAD; --rule: #2E2A3D;
    --done-bg: #221E30; --done-ink: #7B7496;
    --todo-bg: #8B63E8; --todo-ink: #120E1C;
    --opt-bg: #5B9BF0; --opt-ink: #0B1424;
    --ok: #6FBF95; --warn: #E8B85C; --bad: #E3806B;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #131019; --surface: #1B1826; --surface-2: #232032;
  --ink: #EBE8F5; --ink-muted: #948DAD; --rule: #2E2A3D;
  --done-bg: #221E30; --done-ink: #7B7496;
  --todo-bg: #8B63E8; --todo-ink: #120E1C;
  --opt-bg: #5B9BF0; --opt-ink: #0B1424;
  --ok: #6FBF95; --warn: #E8B85C; --bad: #E3806B;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.3);
}
:root[data-theme="light"] {
  --bg: #EFEEF4; --surface: #FCFBFE; --surface-2: #F4F2F9;
  --ink: #191627; --ink-muted: #6A6480; --rule: #DCD8E6;
  --done-bg: #EDEAF4; --done-ink: #8B84A6;
  --todo-bg: #6D4AC4; --todo-ink: #FFFFFF;
  --opt-bg: #2563C9; --opt-ink: #FFFFFF;
  --ok: #2F6B4F; --warn: #8A5A00; --bad: #A33A28;
  --shadow: 0 1px 2px rgba(25,22,39,.06), 0 2px 8px rgba(25,22,39,.04);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.mono {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
}
/* Phone-first: this is used standing in a bathroom, not at a desk. */
.wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }
/* A range needs the width; one day reads best narrow. */
body.ranged .wrap { max-width: 1500px; }
/* The board takes the width; the controls above it keep the one-day width. */
body.ranged header > :not(.eyebrow):not(h1) { max-width: 560px; }
body.ranged #day-card { display: none; }
body:not(.ranged) #board { display: none; }

.views {
  display: inline-flex; gap: 2px; padding: 3px; margin-top: 12px;
  background: var(--surface-2); border: 1px solid var(--rule); border-radius: 10px;
}
.views button {
  border: none; background: transparent; color: var(--ink-muted); font: inherit;
  font-size: .82rem; font-weight: 600; padding: 7px 12px; border-radius: 7px; cursor: pointer;
}
.views button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.custom { display: none; align-items: center; gap: 8px; margin-top: 8px; font-size: .84rem; }
body.view-custom .custom { display: flex; }
body.view-custom .daynav2 { display: none; }
.custom input[type="date"] {
  font: inherit; font-size: .86rem; padding: 7px 9px; border-radius: 9px;
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  font-family: ui-monospace, Menlo, monospace;
}

/* ---- range: one column per day, or a month grid ---------------------------- */
#board { margin-top: 4px; }
.summary { font-size: .8rem; color: var(--ink-muted); margin: 0 0 10px; font-family: ui-monospace, Menlo, monospace; }
.cols { display: grid; gap: 10px; overflow-x: auto; padding-bottom: 6px; align-items: start; }
.month { display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 8px; overflow-x: auto; align-items: start; }
.month .wd { font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted); padding: 0 4px; }
.col {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: var(--shadow); overflow: hidden; min-width: 0;
}
.col.is-today { border-color: var(--todo-bg); box-shadow: 0 0 0 1px var(--todo-bg), var(--shadow); }
.col.blank { visibility: hidden; }
.col-head {
  display: flex; align-items: baseline; gap: 6px; width: 100%; text-align: left;
  border: none; border-bottom: 1px solid var(--rule); background: var(--surface-2);
  color: var(--ink); font: inherit; padding: 8px 10px; cursor: pointer;
}
.col-head:hover { background: var(--bg); }
.col-head .dn { font-size: 1.1rem; font-weight: 700; }
.col-head .dw { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.col-head .cnt { margin-left: auto; font-family: ui-monospace, Menlo, monospace; font-size: .72rem; color: var(--ink-muted); }
.col-body { padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.col.future .col-body { opacity: .78; }
.mini {
  display: flex; align-items: center; gap: 7px; width: 100%; min-width: 0;
  border: none; border-radius: 6px; padding: 7px 8px; text-align: left;
  font: inherit; font-size: .8rem; font-weight: 600; line-height: 1.25; cursor: pointer;
  background: var(--todo-bg); color: var(--todo-ink);
}
.mini.optional { background: var(--opt-bg); color: var(--opt-ink); }
.mini.done { background: var(--done-bg); color: var(--done-ink); font-weight: 400; }
.mini.done .t { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--done-ink) 55%, transparent); }
.mini:disabled { cursor: default; }
.mini .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mini .tag { flex: 0 0 auto; font-family: ui-monospace, Menlo, monospace; font-size: .64rem; font-weight: 400; opacity: .85; }
.mini .tag.missed { background: var(--bad); color: #fff; padding: 1px 4px; border-radius: 3px; opacity: 1; }
.mini .mbox {
  width: 13px; height: 13px; border-radius: 3px; flex: 0 0 auto; border: 1.5px solid currentColor;
}
.mini.done .mbox { background: var(--done-ink); border-color: var(--done-ink); }
.mini input {
  flex: 1 1 60px; min-width: 0; width: 60px; font: inherit; font-size: .78rem; font-weight: 400;
  padding: 3px 5px; border-radius: 5px; border: 1px solid transparent;
  background: var(--surface); color: var(--ink); font-family: ui-monospace, Menlo, monospace;
}
.mini.field { cursor: text; flex-wrap: wrap; row-gap: 5px; }
.mini.field input { flex: 1 0 100%; width: auto; padding: 4px 6px; font-size: .8rem; }
.mini.field .lbl { flex: 0 0 auto; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; }
.month .mini { padding: 5px 6px; font-size: .74rem; }
.empty-day { font-size: .76rem; color: var(--ink-muted); padding: 6px 4px; font-style: italic; }


header { margin-bottom: 18px; }
.eyebrow {
  font-family: ui-monospace, Menlo, monospace; font-size: .66rem;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 6px;
}
h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -.02em; margin: 0; }
.daynav { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.daynav2 { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.date { color: var(--ink); font-size: .95rem; font-weight: 600; flex: 1; text-align: center; }
.step {
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  min-width: 44px; height: 40px; border-radius: 9px; cursor: pointer;
  font: inherit; font-size: 1.05rem; flex: 0 0 auto;
}
.step.wide { min-width: 0; padding: 0 14px; font-size: .84rem; font-weight: 600; }
.step:hover { background: var(--surface-2); }
.daynav2 input[type="date"] {
  flex: 1; min-width: 0; font: inherit; font-size: .9rem; padding: 9px 10px;
  border-radius: 9px; border: 1px solid var(--rule);
  background: var(--surface); color: var(--ink);
  font-family: ui-monospace, Menlo, monospace;
}

.card {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px;
}
.card h2 {
  font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-muted); margin: 0; padding: 11px 14px;
  border-bottom: 1px solid var(--rule); background: var(--surface-2);
}
.body { padding: 10px; display: flex; flex-direction: column; gap: 6px; }

/* Tap targets sized for a thumb, not a cursor. */
.task {
  display: flex; align-items: center; gap: 12px; width: 100%;
  border: none; font: inherit; font-size: .96rem; text-align: left;
  padding: 14px 12px; border-radius: 8px; cursor: pointer;
  background: var(--todo-bg); color: var(--todo-ink); font-weight: 600;
  transition: background .12s, color .12s;
}
.task.done { background: var(--done-bg); color: var(--done-ink); font-weight: 400; }
/* Strike the title, not the tile: a decoration on the tile would run through
   everything inside it, and a descendant cannot cancel an inherited one. */
.task.done .ttl {
  text-decoration: line-through;
  text-decoration-color: color-mix(in srgb, var(--done-ink) 55%, transparent);
}
.task:disabled { opacity: .5; }
.read-only .task:disabled { opacity: 1; cursor: default; }
/* The input dims on a read-only day; the unit sits outside it and would
   otherwise stay at full strength beside a faded number. */
.read-only .field .unit { opacity: .6; }
.read-only #status { color: var(--ink-muted); }
.box {
  width: 20px; height: 20px; border-radius: 5px; flex: 0 0 auto;
  border: 2px solid currentColor; display: flex; align-items: center; justify-content: center;
}
.task.done .box, .field.done .box { background: var(--done-ink); border-color: var(--done-ink); }
.task.done .box::after, .field.done .box::after {
  content: ""; width: 9px; height: 5px;
  border-left: 2px solid var(--surface); border-bottom: 2px solid var(--surface);
  transform: rotate(-45deg) translate(0, -1px);
}
.task .ttl { flex: 1; }

/* Every entry -- measurement or task -- is a tile with a drag handle beside
   it. The handle sits outside the tile so tapping a tile still ticks it and a
   field can still be typed in; only the handle moves things. */
.item { display: flex; gap: 6px; align-items: stretch; position: relative; }

/* Optional tasks are blue rather than purple; done, they fade like any other,
   keeping a blue tick so they still read as optional. */
.task.optional:not(.done), .field.todo.optional { background: var(--opt-bg); color: var(--opt-ink); }
.field.todo.optional label { color: var(--opt-ink); }
.task.optional.done .box, .field.optional.done .box {
  background: color-mix(in srgb, var(--opt-bg) 60%, var(--done-ink));
  border-color: color-mix(in srgb, var(--opt-bg) 60%, var(--done-ink));
}

/* The deadline: quiet while it is still ahead, a red tag once it is missed. */
.due {
  margin-left: auto; flex: 0 0 auto; white-space: nowrap;
  font-family: ui-monospace, Menlo, monospace; font-size: .72rem; font-weight: 400;
  opacity: .8; text-decoration: none;
}
.due:empty { display: none; }
.due.missed {
  opacity: 1; background: var(--bad); color: #fff;
  padding: 2px 6px; border-radius: 4px;
}

/* When a done task was completed, on hover. Clicking it corrects the time. */
.when {
  position: absolute; z-index: 3; top: -11px; right: 42px;
  display: none; align-items: center; gap: 6px;
  padding: 3px 8px; border-radius: 6px; border: 1px solid var(--rule);
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  font-family: ui-monospace, Menlo, monospace; font-size: .72rem;
}
.item.has-when:hover .when, .item.has-when:focus-within .when, .when.editing { display: flex; }
.when button {
  border: none; background: transparent; color: inherit; font: inherit;
  padding: 0; cursor: pointer;
}
.when button.act { color: var(--todo-bg); font-weight: 600; }
.when .pen { opacity: .6; margin-left: 4px; }
.when input {
  font: inherit; padding: 2px 4px; border: 1px solid var(--rule); border-radius: 4px;
  background: var(--bg); color: var(--ink);
}
.item > .task, .item > .field { flex: 1; min-width: 0; }
.grip {
  flex: 0 0 30px; display: flex; align-items: center; justify-content: center;
  border: none; background: transparent; color: var(--ink-muted); padding: 0;
  border-radius: 8px; cursor: grab; touch-action: none;
}
.grip svg { fill: currentColor; }
.grip:hover { background: var(--surface-2); color: var(--ink); }
.item.dragging { position: relative; z-index: 1; }
.item.dragging > .task, .item.dragging > .field {
  box-shadow: 0 6px 18px rgba(25, 22, 39, .22);
}
body.reordering, body.reordering * { cursor: grabbing !important; user-select: none; }

/* A measurement is its own task: the field is the tile. Solid like an open
   task until the reading is in, then faded like a done one. With no task for
   the day at all (an old day before it was tracked) it stays neutral, since
   purple would claim something was due. Same geometry in every state, so
   filling a field never shifts the layout. */
.field {
  display: flex; gap: 12px; align-items: center;
  padding: 6px 12px; border-radius: 8px;
  transition: background .12s, color .12s;
}
.field label {
  font-size: .76rem; color: var(--ink-muted); min-width: 84px;
  font-family: ui-monospace, Menlo, monospace; text-transform: uppercase; letter-spacing: .06em;
}
.field .box { display: none; }
.field.todo, .field.done { cursor: text; }
.field.todo .box, .field.done .box { display: flex; }
.field.todo { background: var(--todo-bg); color: var(--todo-ink); }
.field.todo label { color: var(--todo-ink); font-weight: 600; }
.field.done { background: var(--done-bg); color: var(--done-ink); }
.field.done label {
  color: var(--done-ink);
  text-decoration: line-through;
  text-decoration-color: color-mix(in srgb, var(--done-ink) 55%, transparent);
}
.field.done input { color: var(--done-ink); background: var(--surface); }
.weight-label { display: flex; align-items: center; gap: 5px; }
.weight-warning {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; color: var(--warn); cursor: help;
  font-family: system-ui, sans-serif; font-size: .9rem; line-height: 1;
}
.weight-warning[hidden] { display: none; }
.weight-warning:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; border-radius: 3px; }
.weight-warning-tip {
  position: absolute; z-index: 20; left: -65px; top: calc(100% + 8px);
  width: min(300px, calc(100vw - 48px)); padding: 8px 10px;
  border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--rule));
  border-radius: 7px; background: var(--surface); color: var(--ink);
  box-shadow: var(--shadow); font-family: system-ui, sans-serif;
  font-size: .76rem; font-weight: 500; line-height: 1.35;
  letter-spacing: 0; text-transform: none; visibility: hidden; opacity: 0;
  transform: translateY(3px); transition: opacity .12s, transform .12s;
  pointer-events: none;
}
.weight-warning:hover .weight-warning-tip,
.weight-warning:focus .weight-warning-tip {
  visibility: visible; opacity: 1; transform: translateY(0);
}
/* The unit rides inside the box, against its right edge, so it reads as part
   of the value rather than as a stray word at the far end of the row. */
.field .withunit { flex: 1; min-width: 0; position: relative; display: flex; }
.field .withunit input { padding-right: 44px; }
.field .unit {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  pointer-events: none; font-size: .84rem; color: var(--ink-muted);
  font-family: ui-monospace, Menlo, monospace;
}
.field input {
  flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; padding: 11px 12px;
  border-radius: 8px; border: 1px solid var(--rule);
  background: var(--bg); color: var(--ink);
  font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums;
}
.field input:disabled { opacity: .6; }
/* The only in-flight cue now that the Save buttons are gone. Deliberately
   quiet: a spinner on a field you have already moved on from reads as an
   error. */
.field input.saving { border-color: var(--todo-bg); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--todo-bg); outline-offset: 2px; }
.field.todo input:focus-visible { outline-color: var(--todo-ink); }

#status {
  margin-top: 14px; font-size: .82rem; min-height: 1.3em;
  font-family: ui-monospace, Menlo, monospace;
}
#status.ok { color: var(--ok); }
#status.bad { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* A day switch is one paint. The fade is feedback for a tap; on a switch it
   made the long-lived measurement tiles trail the task tiles, which are
   rebuilt and so change at once. */
body.painting .task, body.painting .field, body.painting .field input { transition: none !important; }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Task Tracker</p>
    <h1>Tasks</h1>
    <div class="views" id="views" role="group" aria-label="Range">
      <button type="button" data-view="day">Day</button>
      <button type="button" data-view="3days">3 days</button>
      <button type="button" data-view="week">Week</button>
      <button type="button" data-view="month">Month</button>
      <button type="button" data-view="custom">Custom</button>
    </div>
    <div class="daynav">
      <button class="step" id="prev-day" type="button" aria-label="Previous day">&larr;</button>
      <div class="date mono" id="date"></div>
      <button class="step" id="next-day" type="button" aria-label="Next day">&rarr;</button>
    </div>
    <div class="daynav2">
      <input type="date" id="pick" aria-label="Jump to a date">
      <button class="step wide" id="go-today" type="button">Today</button>
    </div>
    <div class="custom">
      <input type="date" id="range-start" aria-label="First day">
      <span>to</span>
      <input type="date" id="range-end" aria-label="Last day">
    </div>
  </header>

  <div class="card" id="day-card">
    <h2>Tasks</h2>
    <div class="body" id="tasks">
      <div class="item" id="item-weight">
        <div class="field" id="field-weight">
          <span class="box" aria-hidden="true"></span>
          <label for="weight" class="weight-label">Weight
            <span id="weight-warning" class="weight-warning" role="img" tabindex="0" hidden
                  aria-describedby="weight-warning-tip">&#9888;
              <span id="weight-warning-tip" class="weight-warning-tip" role="tooltip"></span>
            </span>
          </label>
          <div class="withunit">
            <input id="weight" type="number" inputmode="decimal" step="0.1" placeholder="0.0">
            <span class="unit" aria-hidden="true">lbs</span>
          </div>
          <span class="due" id="due-weight"></span>
        </div>
      </div>
      <div class="item" id="item-wake">
        <div class="field" id="field-wake">
          <span class="box" aria-hidden="true"></span>
          <label for="wake">Wake up</label>
          <input id="wake" type="time">
          <span class="due" id="due-wake"></span>
        </div>
      </div>
    </div>
  </div>

  <div id="board"></div>

  <div id="status"></div>
</div>

<script id="bootstrap" type="application/json">__BOOTSTRAP__</script>
<script>
(function () {
  var BOOT = JSON.parse(document.getElementById('bootstrap').textContent);
  var DAY = BOOT.day;
  var MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function parts(day) { return day.split('-').map(Number); }
  function shiftDay(day, n) {
    var q = parts(day);
    var x = new Date(Date.UTC(q[0], q[1] - 1, q[2]) + n * 86400000);
    return x.getUTCFullYear() + '-' +
      String(x.getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(x.getUTCDate()).padStart(2, '0');
  }
  /* The floor travels with the page, so writability is decided here rather
     than fetched -- which is what lets a day change stay client-side. */
  function writable(day) { return day >= BOOT.floor; }

  /* Today, kept current. The page used to fix it at load, so a tab left open
     overnight treated the new day as one that hadn't happened and locked it.
     Read in the app's timezone, not the browser's, to agree with the server. */
  function todayNow() {
    try { return new Date().toLocaleDateString('en-CA', { timeZone: BOOT.tz }); }
    catch (e) { return BOOT.today; }
  }

  function paintHeader(day) {
    var q = parts(day);
    var dd = new Date(Date.UTC(q[0], q[1] - 1, q[2]));
    document.getElementById('date').textContent =
      WD[dd.getUTCDay()] + ', ' + MO[q[1] - 1] + ' ' + q[2] + ', ' + q[0];
    document.getElementById('pick').value = day;
  }

  var CACHE = {};
  var pending = {};

  /* The list order, as titles: what the server says, plus any drag made here
     since. Kept locally so a day painted from the cache comes out in the new
     order straight away rather than in the old one and then jumping. Not under
     the td: prefix, which is pruned as a set of days. */
  var ORDER_KEY = 'task-order';
  var ORDER = (function () {
    try { return JSON.parse(localStorage.getItem(ORDER_KEY)) || []; }
    catch (e) { return []; }
  })();
  /* Bumped by every local reorder. A read that started before one must not
     teach us the order it replaced. */
  var orderVersion = 0;

  function setOrder(order) {
    ORDER = order;
    try { localStorage.setItem(ORDER_KEY, JSON.stringify(order)); } catch (e) { /* fine */ }
  }

  /* Lay `sub` -- the titles one day shows, in its order -- over `base`. Titles
     the day does not show keep their places, so learning from or dragging on a
     day that lacks some task never loses that task's position. */
  function mergeOrder(base, sub) {
    var inSub = {}, known = {};
    sub.forEach(function (t) { inSub[t] = true; });
    base.forEach(function (t) { known[t] = true; });
    var out = base.slice(), slots = [];
    out.forEach(function (t, i) { if (inSub[t]) slots.push(i); });
    var placed = sub.filter(function (t) { return known[t]; });
    slots.forEach(function (s, k) { out[s] = placed[k]; });
    sub.forEach(function (t) { if (!known[t]) out.push(t); });
    return out;
  }

  /* Last known rows per day, surviving reload and reboot. This is what makes
     the page paint instantly instead of waiting out a cold start. It is a
     cache, never the truth -- every day painted from it is re-read from the
     server immediately, and the indicator says so until that lands. */
  var STORE = 'td:', STORE_KEEP = 120;

  function storeRead(day) {
    try {
      var raw = localStorage.getItem(STORE + day);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }             // private mode, or disabled
  }

  function storeWrite(day, rows) {
    try {
      localStorage.setItem(STORE + day, JSON.stringify(rows));
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(STORE) === 0) keys.push(k);
      }
      /* ISO dates sort lexically, so the oldest are simply the first. */
      if (keys.length > STORE_KEEP) {
        keys.sort().slice(0, keys.length - STORE_KEEP).forEach(function (k) {
          localStorage.removeItem(k);
        });
      }
    } catch (e) { /* quota or private mode -- the app is fine without it */ }
  }

  var requestVersion = {};

  function fetchDay(day, fresh) {
    if (!fresh && CACHE[day]) return Promise.resolve(CACHE[day]);
    var key = day + (fresh ? ':fresh' : ':cached');
    if (pending[key]) return pending[key];
    var version = (requestVersion[day] || 0) + 1;
    requestVersion[day] = version;
    var orderAtStart = orderVersion;
    pending[key] = fetch('/api/day/' + day + (fresh ? '?fresh=true' : ''),
                         fresh ? { cache: 'no-store' } : {})
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (rows) {
        delete pending[key];
        /* A slow background prefetch must never replace a newer live read. */
        if (requestVersion[day] === version) {
          CACHE[day] = rows;
          storeWrite(day, rows);
        }
        /* The server's order, learned from a live read of a current day that
           has both measurements -- an old day lists tasks that no longer run,
           and a not-yet-filled day lists none. Skipped if a reorder happened
           here since the request left, or one is still being saved. */
        var titles = rows.map(function (r) { return r.title; });
        if (fresh && writable(day) && orderAtStart === orderVersion && !orderSaving &&
            titles.indexOf(WEIGH) >= 0 && titles.indexOf(WAKE) >= 0) {
          setOrder(mergeOrder(ORDER, titles));
        }
        return rows;
      }, function (e) { delete pending[key]; throw e; });
    return pending[key];
  }

  function showDay(day, opts) {
    opts = opts || {};
    DAY = day;
    paintHeader(day);
    if (!opts.pop) {
      history[opts.replace ? 'replaceState' : 'pushState'](
        { view: 'day', day: day }, '', day === todayNow() ? '/' : '/?day=' + day);
    }

    var ro = !writable(day);
    document.body.classList.toggle('read-only', ro);
    ['weight', 'wake'].forEach(function (id) {
      document.getElementById(id).disabled = ro || day > todayNow();
    });
    say(ro ? 'Read-only: ' + day + ' is before ' + BOOT.floor +
             ', the reconciled history.' : '');

    /* Paint what we already know before touching the network. On a warm
       instance the confirmation lands in tens of ms and nothing visibly
       happens; on a cold one the day is readable while the server boots. */
    var known = CACHE[day] || storeRead(day);
    var knownJson = known ? JSON.stringify(known) : null;
    render(known || []);

    /* Confirm against the server behind the paint. Not announced: the check
       is for the page's benefit, and a label flashing on every day change is
       noise. A real difference repaints; a failure says so below. */
    return fetchDay(day, true).then(function (rows) {
      if (DAY !== day) return;                   // stepped past it while loading
      /* Only repaint on a real difference. Re-rendering identical rows would
         throw away focus and any half-typed measurement to show the same
         thing, which is exactly the flicker this is meant to remove. */
      if (JSON.stringify(rows) !== knownJson) render(rows);
      prefetchAdjacent(day);
    }).catch(function (e) {
      /* With a local copy on screen this is a stale-data warning, not a
         failure: say which it is rather than blaming the rows on display. */
      say(known ? 'Showing the last known copy: ' + e.message
                : 'Could not load: ' + e.message, true);
    });
  }

  /* Three days either side, in one live request, so the next day is already
     here -- and correct -- when you step to it. Only days not yet held are
     asked for; a day already shown has had its own live read. */
  var PREFETCH = 3, prefetching = null;
  function prefetchAdjacent(day) {
    var want = [];
    for (var i = -PREFETCH; i <= PREFETCH; i++) {
      var d = shiftDay(day, i);
      if (i && !CACHE[d]) want.push(d);
    }
    if (!want.length || prefetching) return;
    var start = want[0], end = want[want.length - 1];
    var versions = {};
    want.forEach(function (d) { versions[d] = requestVersion[d] || 0; });
    prefetching = fetch('/api/range?start=' + start + '&end=' + end, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return;
        Object.keys(data.days).forEach(function (d) {
          /* Never overwrite a day read live, or changed here, since this left. */
          if (CACHE[d] || (requestVersion[d] || 0) !== (versions[d] || 0)) return;
          CACHE[d] = data.days[d];
          storeWrite(d, data.days[d]);
        });
      })
      .catch(function () { /* the day's own live read covers it */ })
      .then(function () { prefetching = null; });
  }

  /* ---- views ---------------------------------------------------------------
     One day, or a range of days. Arrows, the date picker, Today and the arrow
     keys all move within whichever is showing. */
  var VIEW = BOOT.view || 'day';
  var CUSTOM = { start: BOOT.start || shiftDay(BOOT.day, -6), end: BOOT.end || BOOT.day };

  function step(dir) {
    if (VIEW === 'day') return showDay(shiftDay(DAY, dir));
    if (VIEW === 'month') return go('month', addMonths(DAY, dir));
    if (VIEW === 'custom') {
      var span = daysBetween(CUSTOM.start, CUSTOM.end) + 1;
      CUSTOM = { start: shiftDay(CUSTOM.start, dir * span), end: shiftDay(CUSTOM.end, dir * span) };
      return go('custom', CUSTOM.end);
    }
    return go(VIEW, shiftDay(DAY, dir * (VIEW === 'week' ? 7 : 3)));
  }

  document.getElementById('prev-day').addEventListener('click', function () { step(-1); });
  document.getElementById('next-day').addEventListener('click', function () { step(1); });
  document.getElementById('pick').addEventListener('change', function (e) {
    if (e.target.value) go(VIEW, e.target.value);
  });
  document.getElementById('go-today').addEventListener('click', function () {
    go(VIEW, todayNow());
  });
  ['range-start', 'range-end'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () {
      var s = document.getElementById('range-start').value;
      var e = document.getElementById('range-end').value;
      if (!s || !e) return;
      if (e < s) { var x = s; s = e; e = x; }
      if (daysBetween(s, e) >= BOOT.rangeMax) e = shiftDay(s, BOOT.rangeMax - 1);
      CUSTOM = { start: s, end: e };
      go('custom', e);
    });
  });
  document.getElementById('views').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-view]');
    if (b) go(b.dataset.view, DAY);
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  window.addEventListener('popstate', function (e) {
    var s = e.state || {};
    if (s.start) CUSTOM = { start: s.start, end: s.end };
    go(s.view || 'day', s.day || BOOT.day, { pop: true });
  });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function say(msg, bad) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = !msg ? '' : (bad ? 'bad' : 'ok');
  }
  function weightWarning(msg) {
    var icon = document.getElementById('weight-warning');
    var tip = document.getElementById('weight-warning-tip');
    icon.hidden = !msg;
    tip.textContent = msg || '';
    icon.setAttribute('aria-label', msg ? 'Weight warning: ' + msg : '');
  }
  function setDone(el, done) { el.classList.toggle('done', done); }

  /* One reader for the wake-up note, used by both the input prefill and the
     row read-out. `value` is what <input type=time> wants; `display` is what
     reads naturally beside the task. */
  function wakeFromNotes(notes) {
    if (!notes) return null;
    var m = /(\d{1,2}):(\d{2})\s*([AaPp][Mm])/.exec(notes);
    if (!m) return null;
    var h = Number(m[1]) % 12;
    if (m[3].toLowerCase() === 'pm') h += 12;
    return {
      value: String(h).padStart(2, '0') + ':' + m[2],
      display: (h % 12 || 12) + ':' + m[2] + ' ' + (h < 12 ? 'am' : 'pm')
    };
  }

  var writesInFlight = 0;

  function post(url, body) {
    writesInFlight++;
    var settled = function () { writesInFlight--; };
    var opts = { method: 'POST' };
    if (body !== undefined) {
      opts.headers = { 'Content-Type': 'application/json' };
      opts.body = JSON.stringify(body);
    }
    return fetch(url, opts).then(function (res) {
      if (res.ok) return res.json();
      return res.json().catch(function () { return {}; }).then(function (j) {
        throw new Error(j.detail || ('HTTP ' + res.status));
      });
    }).then(
      function (v) { settled(); return v; },
      function (e) { settled(); throw e; }
    );
  }

  var WEIGH = 'Weigh yourself', WAKE = 'Wake Up';

  /* A measurement field's tile: 'todo' while the reading is due, 'done' once
     it is in, '' when the day has no such task. */
  function setTile(id, state) {
    var tile = document.getElementById('field-' + id);
    tile.classList.toggle('todo', state === 'todo');
    tile.classList.toggle('done', state === 'done');
  }
  function tileState(id) {
    var tile = document.getElementById('field-' + id);
    return tile.classList.contains('done') ? 'done'
         : tile.classList.contains('todo') ? 'todo' : '';
  }
  /* Clicking anywhere on the tile goes to its input, as tapping a task does. */
  ['weight', 'wake'].forEach(function (id) {
    document.getElementById('field-' + id).addEventListener('click', function (e) {
      var input = document.getElementById(id);
      if (e.target === input || input.disabled) return;
      input.focus();
      if (id === 'wake' && input.showPicker) {
        try { input.showPicker(); } catch (err) { /* not a user gesture */ }
      }
    });
  });

  function render(rows) {
    document.body.classList.add('painting');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { document.body.classList.remove('painting'); });
    });
    var host = document.getElementById('tasks');
    /* Drop the last day's task entries. The two measurement entries are
       permanent nodes and stay put: removing one would blur a field being
       typed in, and blur saves. */
    Array.prototype.slice.call(host.querySelectorAll('.item.task-item'))
      .forEach(function (n) { n.remove(); });
    var entries = [], seen = {};
    /* Reset before each day. The prefill below only writes when the day has a
       value, so on a day without one the previous day's reading would sit in
       the box -- and `saved` would suppress the save that corrects it.

       A field being typed in is left alone. render() is no longer only a day
       change: a save confirmation and the background revalidation both reach
       here, and either one clearing the box mid-entry looks exactly like the
       app eating your input. */
    ['weight', 'wake'].forEach(function (id) {
      setTile(id, '');
      document.getElementById('item-' + id)._row = null;
      var el = document.getElementById(id);
      if (document.activeElement === el) return;
      el.value = '';
      saved[id] = null;
    });
    weightWarning('');
    rows.forEach(function (r) {
      /* These two are readings, not checkboxes, and their field is their
         tile -- a second tile in Tasks would only repeat it. Prefill from what
         is recorded, so a re-save shows the current value, not an empty box. */
      if (r.title === WEIGH) {
        document.getElementById('item-weight')._row = r;
        entries.push({ title: r.title, node: document.getElementById('item-weight'), seq: entries.length });
        seen.weight = true;
        setTile('weight', r.is_completed ? 'done' : 'todo');
        if (r.weight_lbs !== null && r.weight_lbs !== undefined) {
          var wEl = document.getElementById('weight');
          if (document.activeElement !== wEl) {
            wEl.value = Number(r.weight_lbs).toFixed(1);
            saved.weight = wEl.value;
          }
        }
        return;
      }
      if (r.title === WAKE) {
        document.getElementById('item-wake')._row = r;
        entries.push({ title: r.title, node: document.getElementById('item-wake'), seq: entries.length });
        seen.wake = true;
        setTile('wake', r.is_completed ? 'done' : 'todo');
        var w = wakeFromNotes(r.notes);
        var kEl = document.getElementById('wake');
        if (w && document.activeElement !== kEl) {
          kEl.value = w.value;
          saved.wake = w.value;
        }
        return;
      }

      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'task' + (r.is_completed ? ' done' : '');
      b.innerHTML = '<span class="box"></span><span class="ttl">' + esc(r.title) +
        '</span><span class="due"></span>';
      if (!writable(r.day) || r.day > todayNow()) {
        b.disabled = true;
        b.style.cursor = 'default';
        b.style.opacity = '1';
      }
      /* Optimistic: flip the tile now, confirm in the background. A write is
         ~160ms and re-reading the day was another ~200ms, so waiting for both
         meant a third of a second of spinner on every tap. Rapid taps update
         the desired state immediately and are serialized below. */
      function syncDesired() {
        var sent = r.is_completed;
        b.dataset.syncing = '1';
        /* A scheduled task has no row, and so no id, until something is
           recorded: address it by day and title, and the server makes it. */
        post(r.id ? '/api/task/' + r.id + '/toggle?done=' + sent
                  : '/api/day/' + r.day + '/check?title=' + encodeURIComponent(r.title) + '&done=' + sent)
          .then(function (updated) {
            if (updated && updated.weight_lbs !== undefined) r.weight_lbs = updated.weight_lbs;
            if (updated && 'completed_at' in updated) r.completed_at = updated.completed_at;
            if (updated && updated.id) { r.id = updated.id; delete r.virtual; }
            decorate(item);
          })
          .catch(function (e) {
            /* If the user clicked again, preserve that newer desired state and
               let the next request retry it. Only revert when this request
               still represents the visible state. */
            if (r.is_completed === sent) {
              r.is_completed = !sent;
              setDone(b, !sent);
              decorate(item);
              say(e.message, true);
            }
          })
          .then(function () {
            if (r.is_completed !== sent) {
              syncDesired();
              return;
            }
            delete b.dataset.syncing;
            storeWrite(DAY, rows);
            say(r.title + (sent ? ' done' : ' un-done'));
          });
      }

      b.addEventListener('click', function () {
        if (b.disabled) return;
        var next = !r.is_completed;
        r.is_completed = next;
        r.completed_at = next ? new Date().toISOString() : null;
        setDone(b, next);
        decorate(item);
        if (!b.dataset.syncing) syncDesired();
      });
      var item = document.createElement('div');
      item.className = 'item task-item';
      item._row = r;
      item.dataset.title = r.title;
      item.appendChild(b);
      item.appendChild(makeGrip(r.title));
      entries.push({ title: r.title, node: item, seq: entries.length });
    });

    /* A day without a measurement task -- before it was tracked -- still
       shows the field, neutral, where the order puts it. */
    if (!seen.weight) entries.push({ title: WEIGH, node: document.getElementById('item-weight'), seq: -2 });
    if (!seen.wake) entries.push({ title: WAKE, node: document.getElementById('item-wake'), seq: -1 });

    var rank = {};
    ORDER.forEach(function (t, i) { rank[t] = i; });
    entries.sort(function (a, b) {
      var ra = a.title in rank ? rank[a.title] : Infinity;
      var rb = b.title in rank ? rank[b.title] : Infinity;
      return ra !== rb ? (ra < rb ? -1 : 1) : a.seq - b.seq;
    });
    arrange(host, entries.map(function (e) { return e.node; }));
    entries.forEach(function (e) { decorate(e.node); });
  }

  /* ---- optional, deadline, completion time ------------------------------ */
  function hm(d) { return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  function localDay(d) { return d.toLocaleDateString('en-CA'); }   // YYYY-MM-DD
  /* The value an <input type=datetime-local> wants, in this browser's time. */
  function localInput(d) {
    var z = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) +
      'T' + z(d.getHours()) + ':' + z(d.getMinutes());
  }

  /* Missed: ticked after the deadline, or still unticked once it has passed.
     An unticked optional task is allowed to go undone, so only a late tick
     counts against it. */
  function deadlineState(r) {
    if (!r || !r.deadline_at) return null;
    var due = new Date(r.deadline_at);
    var late = r.is_completed
      ? (r.completed_at && new Date(r.completed_at) > due)
      : (!r.optional && Date.now() > due);
    return { due: due, missed: !!late };
  }

  function decorate(item) {
    var r = item._row;
    var tile = item.querySelector('.task, .field');
    tile.classList.toggle('optional', !!(r && r.optional));

    var tag = item.querySelector('.due');
    var st = deadlineState(r);
    if (!st) {
      tag.textContent = '';
      tag.className = 'due';
    } else {
      var when = hm(st.due) + (localDay(st.due) > r.day ? ' next day' : '');
      tag.className = 'due' + (st.missed ? ' missed' : '');
      tag.textContent = st.missed ? 'missed ' + when : 'by ' + when;
      tag.title = st.missed ? 'Deadline was ' + when : 'Deadline ' + when;
    }

    var pill = item.querySelector('.when');
    var show = !!(r && r.is_completed && r.completed_at);
    item.classList.toggle('has-when', show);
    if (!show) { if (pill) pill.remove(); return; }
    if (pill && pill.classList.contains('editing')) return;
    if (!pill) {
      pill = document.createElement('div');
      pill.className = 'when';
      item.appendChild(pill);
    }
    var at = new Date(r.completed_at);
    var label = (localDay(at) === r.day ? '' :
      at.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + ' ') + hm(at);
    pill.innerHTML = '';
    var b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = 'Completed ' + esc(label) +
      (writable(r.day) ? '<span class="pen" aria-hidden="true">&#9998;</span>' : '');
    b.title = writable(r.day) ? 'Correct when this was done' : '';
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      if (writable(r.day)) editWhen(item, pill);
    });
    pill.appendChild(b);
  }

  function editWhen(item, pill) {
    var r = item._row;
    pill.classList.add('editing');
    pill.innerHTML = '';
    var input = document.createElement('input');
    input.type = 'datetime-local';
    input.value = localInput(new Date(r.completed_at));
    input.min = r.day + 'T00:00';
    input.max = localInput(new Date());
    var save = document.createElement('button');
    save.type = 'button'; save.className = 'act'; save.textContent = 'Save';
    var cancel = document.createElement('button');
    cancel.type = 'button'; cancel.textContent = 'Cancel';
    [input, save, cancel].forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); });
      pill.appendChild(el);
    });
    function close() { pill.classList.remove('editing'); decorate(item); }
    cancel.addEventListener('click', close);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') close();
      if (e.key === 'Enter') save.click();
    });
    save.addEventListener('click', function () {
      if (!input.value) return;
      var iso = new Date(input.value).toISOString();
      save.disabled = true;
      post('/api/task/' + r.id + '/completed_at?at=' + encodeURIComponent(iso))
        .then(function (updated) {
          r.completed_at = (updated && updated.completed_at) || iso;
          storeWrite(DAY, CACHE[DAY] || []);
          say(r.title + ' completed at ' + hm(new Date(r.completed_at)));
          close();
        })
        .catch(function (e) { save.disabled = false; say(e.message, true); });
    });
    input.focus();
  }

  /* A deadline can pass while the page sits open; re-check once a minute. */
  setInterval(function () {
    Array.prototype.forEach.call(document.querySelectorAll('#tasks > .item'), function (n) {
      if (n._row) decorate(n);
    });
  }, 60000);

  /* Put `nodes` in order without ever moving the one holding focus. Moving a
     focused node blurs it, and a blurred measurement field saves whatever is
     half-typed in it -- so everything else moves around it instead. */
  function arrange(host, nodes) {
    var anchor = null;
    nodes.forEach(function (n) { if (n.contains(document.activeElement)) anchor = n; });
    if (!anchor) {
      nodes.forEach(function (n, i) {
        if (host.children[i] !== n) host.insertBefore(n, host.children[i] || null);
      });
      return;
    }
    var k = nodes.indexOf(anchor), ref = anchor;
    nodes.slice(0, k).forEach(function (n) { host.insertBefore(n, anchor); });
    nodes.slice(k + 1).forEach(function (n) { host.insertBefore(n, ref.nextSibling); ref = n; });
  }

  var GRIP = '<svg width="12" height="18" viewBox="0 0 12 18" aria-hidden="true" focusable="false">' +
    '<circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/>' +
    '<circle cx="3" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/>' +
    '<circle cx="3" cy="15" r="1.6"/><circle cx="9" cy="15" r="1.6"/></svg>';

  function makeGrip(title) {
    var g = document.createElement('button');
    g.type = 'button';
    g.className = 'grip';
    g.setAttribute('aria-label', 'Move ' + title + ' (arrow keys)');
    g.innerHTML = GRIP;
    return g;
  }

  /* ---- reordering --------------------------------------------------------
     Drag a handle, by mouse or touch; or focus one and use the arrow keys. The
     list rearranges as you go and the new order is saved when you let go. */
  var orderSaving = false, orderTimer = null;

  function shownOrder() {
    return Array.prototype.map.call(
      document.querySelectorAll('#tasks > .item'), function (n) { return n.dataset.title; });
  }

  function saveOrder() {
    clearTimeout(orderTimer);
    orderVersion++;
    setOrder(mergeOrder(ORDER, shownOrder()));
    orderSaving = true;
    post('/api/task_order', { titles: ORDER })
      .catch(function (e) { say('Could not save the order: ' + e.message, true); })
      .then(function () { orderSaving = false; });
  }
  function saveOrderSoon() {
    clearTimeout(orderTimer);
    orderVersion++;
    orderTimer = setTimeout(saveOrder, 600);
  }

  (function () {
    var host = document.getElementById('tasks');
    document.getElementById('item-weight').dataset.title = WEIGH;
    document.getElementById('item-wake').dataset.title = WAKE;
    document.getElementById('item-weight').appendChild(makeGrip(WEIGH));
    document.getElementById('item-wake').appendChild(makeGrip(WAKE));

    var drag = null;
    function move(e) {
      var item = drag.item, before = null;
      var others = Array.prototype.filter.call(host.children, function (n) { return n !== item; });
      for (var i = 0; i < others.length; i++) {
        var r = others[i].getBoundingClientRect();
        if (e.clientY < r.top + r.height / 2) { before = others[i]; break; }
      }
      if (item.nextElementSibling !== before) {
        host.insertBefore(item, before);
        drag.moved = true;
      }
    }
    function end() {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', end);
      window.removeEventListener('pointercancel', end);
      drag.item.classList.remove('dragging');
      document.body.classList.remove('reordering');
      if (drag.moved) saveOrder();
      drag = null;
    }
    host.addEventListener('pointerdown', function (e) {
      var grip = e.target.closest && e.target.closest('.grip');
      if (!grip || e.button > 0 || drag) return;
      e.preventDefault();
      drag = { item: grip.closest('.item'), moved: false };
      drag.item.classList.add('dragging');
      document.body.classList.add('reordering');
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', end);
      window.addEventListener('pointercancel', end);
    });
    host.addEventListener('keydown', function (e) {
      var grip = e.target.closest && e.target.closest('.grip');
      if (!grip || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
      e.preventDefault();
      var item = grip.closest('.item');
      if (e.key === 'ArrowUp' && item.previousElementSibling) {
        host.insertBefore(item, item.previousElementSibling);
        grip.focus();
      } else if (e.key === 'ArrowDown' && item.nextElementSibling) {
        host.insertBefore(item.nextElementSibling, item);
      } else {
        return;
      }
      saveOrderSoon();
    });
  })();

  /* After a write the cached copy of the day is stale, so drop it and let
     fetchDay repopulate. The rest of the window is untouched. */
  function load() {
    var day = DAY;
    delete CACHE[day];
    return fetchDay(day, true).then(function (rows) {
      if (DAY === day) render(rows);
    });
  }

  /* Both fields save themselves on `change` -- which on these inputs means
     blur or Enter, i.e. when you are done with the field.

     Not a debounce on `input`. A debounce fires on any typing pause, so
     entering 146.8 posts "1", "14", "146" on the way, and each accepted one
     calls load() -> render(), which writes a formatted value straight into
     the box you are still typing in. That is where the stray ".0" came from.
     No delay is short enough to fix this: the problem is writing to a field
     under the cursor, not how long you wait first. */
  var saved = { weight: null, wake: null };

  function autosave(id, build, describe) {
    var el = document.getElementById(id);

    function save() {
      var v = el.value;
      if (!v || v === saved[id]) return;      // cleared, or nothing changed
      var was = tileState(id);
      /* A measurement resolves its task by definition. Show that result at
         input speed; Vercel's write plus confirmation read can take long
         enough for a network-gated checkmark to feel broken. */
      setTile(id, 'done');
      el.classList.add('saving');
      post(build(v))
        .then(function (result) {
          saved[id] = v;
          return load().then(function () {      // reflects the auto-completion
            if (id === 'weight') weightWarning(result.warning || '');
            say(describe(v));
          });
        })
        .catch(function (e) {
          setTile(id, was);
          say(e.message, true);
        })
        .then(function () { el.classList.remove('saving'); });
    }

    el.addEventListener('change', save);
  }

  autosave('weight',
    function (v) { return '/api/day/' + DAY + '/weight?lbs=' + encodeURIComponent(v); },
    function (v) { return 'Weight saved: ' + Number(v).toFixed(1) + ' lbs'; });

  autosave('wake',
    function (v) { return '/api/day/' + DAY + '/wake?time=' + encodeURIComponent(v); },
    function (v) { return 'Wake-up saved: ' + v; });

  /* Re-read the day on the quiet, and repaint only if the server disagrees.
     Without this the page is correct when opened and drifts from then on --
     which is exactly how it felt stale on a second computer.

     No "checking..." here: that indicator is for a reader waiting on a first
     paint, and blinking it every minute would be noise. A change that does
     land is announced, because content rearranging itself in silence is the
     thing that felt broken. */
  var POLL_MS = 60000;

  function revalidate() {
    if (document.hidden || writesInFlight) return;
    if (VIEW !== 'day') {
      var r = rangeOf(VIEW, DAY);
      loadRange(r[0], r[1], true);
      return;
    }
    var day = DAY;
    var before = CACHE[day] ? JSON.stringify(CACHE[day]) : null;
    fetchDay(day, true).then(function (rows) {
      if (DAY !== day || !before) return;
      if (JSON.stringify(rows) !== before) {
        render(rows);
        say('Updated');
      }
    }).catch(function () { /* keep showing what we have */ });
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) revalidate();
  });
  window.addEventListener('focus', revalidate);
  setInterval(revalidate, POLL_MS);

  /* showDay handles read-only, materialising and the window; the first call
     just points it at the day the server rendered. replace rather than push so
     the entry the browser already has is not duplicated. */

  /* ---- ranges ------------------------------------------------------------ */
  function daysBetween(a, b) {
    var p = parts(a), q = parts(b);
    return Math.round((Date.UTC(q[0], q[1] - 1, q[2]) - Date.UTC(p[0], p[1] - 1, p[2])) / 86400000);
  }
  function weekday(day) { var q = parts(day); return new Date(Date.UTC(q[0], q[1] - 1, q[2])).getUTCDay(); }
  function addMonths(day, n) {
    var q = parts(day), x = new Date(Date.UTC(q[0], q[1] - 1 + n, 1));
    return x.getUTCFullYear() + '-' + String(x.getUTCMonth() + 1).padStart(2, '0') + '-01';
  }
  /* [first, last] day a view shows around `day`. Weeks start on Monday. */
  function rangeOf(view, day) {
    if (view === '3days') return [shiftDay(day, -1), shiftDay(day, 1)];
    if (view === 'week') { var s = shiftDay(day, -((weekday(day) + 6) % 7)); return [s, shiftDay(s, 6)]; }
    if (view === 'month') {
      var first = day.slice(0, 8) + '01';
      return [first, shiftDay(addMonths(first, 1), -1)];
    }
    if (view === 'custom') return [CUSTOM.start, CUSTOM.end];
    return [day, day];
  }
  function label(day, opts) {
    var q = parts(day);
    return new Date(Date.UTC(q[0], q[1] - 1, q[2])).toLocaleDateString([],
      Object.assign({ timeZone: 'UTC' }, opts));
  }

  function urlFor(view, day) {
    if (view === 'day') return '/?day=' + day;
    if (view === 'custom') return '/?view=custom&start=' + CUSTOM.start + '&end=' + CUSTOM.end;
    return '/?view=' + view + '&day=' + day;
  }

  function go(view, day, opts) {
    opts = opts || {};
    VIEW = view;
    document.body.classList.toggle('ranged', view !== 'day');
    ['day', '3days', 'week', 'month', 'custom'].forEach(function (v) {
      document.body.classList.toggle('view-' + v, v === view);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#views button'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.view === view));
    });
    if (view === 'day') return showDay(day, opts);

    DAY = day;
    var r = rangeOf(view, day);
    document.getElementById('date').textContent = view === 'month'
      ? label(r[0], { month: 'long', year: 'numeric' })
      : label(r[0], { month: 'short', day: 'numeric' }) + ' – ' +
        label(r[1], { month: 'short', day: 'numeric', year: 'numeric' });
    document.getElementById('pick').value = day;
    document.getElementById('range-start').value = CUSTOM.start;
    document.getElementById('range-end').value = CUSTOM.end;
    if (!opts.pop) {
      history[opts.replace ? 'replaceState' : 'pushState'](
        { view: view, day: day, start: CUSTOM.start, end: CUSTOM.end }, '', urlFor(view, day));
    }
    say('');
    return loadRange(r[0], r[1]);
  }

  var RANGE = null, rangeSeq = 0;

  /* `background` is the periodic re-read: it must never redraw under someone
     typing. A range you asked for always draws. */
  function loadRange(start, end, background) {
    var seq = ++rangeSeq;
    return fetch('/api/range?start=' + start + '&end=' + end, { cache: 'no-store' })
      .then(function (res) {
        return res.json().then(function (j) {
          if (!res.ok) throw new Error(j.detail || ('HTTP ' + res.status));
          return j;
        });
      })
      .then(function (data) {
        if (seq !== rangeSeq) return;              // a newer range was asked for
        var board = document.getElementById('board');
        if (background && board.contains(document.activeElement) &&
            document.activeElement.tagName === 'INPUT') return;
        RANGE = data;
        renderBoard();
      })
      .catch(function (e) { if (seq === rangeSeq) say('Could not load: ' + e.message, true); });
  }

  function owed(rows) {
    return rows.filter(function (r) { return r.is_completed || !r.optional; }).length;
  }

  function renderBoard() {
    var board = document.getElementById('board');
    var days = Object.keys(RANGE.days).sort();
    var done = 0, total = 0;
    days.forEach(function (d) {
      if (d > RANGE.today) return;
      var rows = RANGE.days[d];
      done += rows.filter(function (r) { return r.is_completed; }).length;
      total += owed(rows);
    });
    board.innerHTML = '';
    var sum = document.createElement('p');
    sum.className = 'summary';
    sum.textContent = total ? done + ' of ' + total + ' done so far in view' : 'Nothing due yet in view';
    board.appendChild(sum);

    var grid = document.createElement('div');
    if (VIEW === 'month') {
      grid.className = 'month';
      ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].forEach(function (w) {
        var h = document.createElement('div'); h.className = 'wd'; h.textContent = w; grid.appendChild(h);
      });
      for (var i = 0; i < (weekday(days[0]) + 6) % 7; i++) {
        var blank = document.createElement('div'); blank.className = 'col blank'; grid.appendChild(blank);
      }
    } else {
      grid.className = 'cols';
      grid.style.gridTemplateColumns = 'repeat(' + days.length + ', minmax(160px, 1fr))';
    }
    days.forEach(function (d) { grid.appendChild(column(d)); });
    board.appendChild(grid);
  }

  function column(day) {
    var rows = RANGE.days[day];
    var future = day > RANGE.today, locked = future || !writable(day);
    var col = document.createElement('div');
    col.className = 'col' + (day === RANGE.today ? ' is-today' : '') + (future ? ' future' : '');
    var nDone = rows.filter(function (r) { return r.is_completed; }).length;
    var head = document.createElement('button');
    head.type = 'button';
    head.className = 'col-head';
    head.title = 'Open ' + day;
    head.innerHTML = '<span class="dn">' + parts(day)[2] + '</span><span class="dw">' +
      esc(label(day, { weekday: 'short' })) + '</span>' +
      (rows.length && !future ? '<span class="cnt">' + nDone + '/' + owed(rows) + '</span>' : '');
    head.addEventListener('click', function () { go('day', day); });
    col.appendChild(head);

    var body = document.createElement('div');
    body.className = 'col-body';
    if (!rows.length) body.innerHTML = '<div class="empty-day">Nothing scheduled</div>';
    rows.forEach(function (r) { body.appendChild(r.title === WEIGH || r.title === WAKE ? field(r, locked) : tile(r, locked)); });
    col.appendChild(body);
    return col;
  }

  function tagFor(r) {
    var st = deadlineState(r);
    if (!st) return '';
    var when = hm(st.due) + (localDay(st.due) > r.day ? '+1' : '');
    return '<span class="tag' + (st.missed ? ' missed' : '') + '">' + (st.missed ? 'missed ' : '') + when + '</span>';
  }

  function paintMini(el, r) {
    el.classList.toggle('done', !!r.is_completed);
    el.classList.toggle('optional', !!r.optional && !r.is_completed);
    el.title = r.is_completed && r.completed_at
      ? 'Completed ' + new Date(r.completed_at).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })
      : '';
  }

  function tile(r, locked) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'mini';
    b.disabled = locked;
    b.innerHTML = '<span class="mbox"></span><span class="t">' + esc(r.title) + '</span>' + tagFor(r);
    paintMini(b, r);
    b.addEventListener('click', function () {
      var next = !r.is_completed;
      r.is_completed = next;
      r.completed_at = next ? new Date().toISOString() : null;
      paintMini(b, r);
      post(r.id ? '/api/task/' + r.id + '/toggle?done=' + next
                : '/api/day/' + r.day + '/check?title=' + encodeURIComponent(r.title) + '&done=' + next)
        .then(function (u) {
          if (u && u.id) { r.id = u.id; delete r.virtual; }
          if (u && 'completed_at' in u) r.completed_at = u.completed_at;
          paintMini(b, r);
          delete CACHE[r.day];
          say(r.title + (next ? ' done' : ' un-done') + ' · ' + label(r.day, { month: 'short', day: 'numeric' }));
        })
        .catch(function (e) {
          r.is_completed = !next;
          paintMini(b, r);
          say(e.message, true);
        });
    });
    return b;
  }

  /* Weight and wake-up, editable in place. Saved on change -- blur or Enter --
     like the day view, never while typing. */
  function field(r, locked) {
    var isW = r.title === WEIGH;
    var el = document.createElement('div');
    el.className = 'mini field';
    var input = document.createElement('input');
    if (isW) { input.type = 'number'; input.step = '0.1'; input.inputMode = 'decimal'; input.placeholder = 'lbs'; }
    else { input.type = 'time'; }
    input.disabled = locked;
    var shown = isW ? (r.weight_lbs != null ? Number(r.weight_lbs).toFixed(1) : '') : ((wakeFromNotes(r.notes) || {}).value || '');
    input.value = shown;
    el.innerHTML = '<span class="mbox"></span><span class="lbl">' + (isW ? 'Weight' : 'Wake') + '</span>';
    el.appendChild(input);
    var tag = tagFor(r);
    if (tag) el.insertAdjacentHTML('beforeend', tag);
    paintMini(el, r);
    el.addEventListener('click', function (e) { if (e.target !== input && !input.disabled) input.focus(); });
    input.addEventListener('change', function () {
      var v = input.value;
      if (!v || v === shown) return;
      var url = isW ? '/api/day/' + r.day + '/weight?lbs=' + encodeURIComponent(v)
                    : '/api/day/' + r.day + '/wake?time=' + encodeURIComponent(v);
      var was = r.is_completed;
      r.is_completed = true; paintMini(el, r);
      post(url).then(function (u) {
        shown = v;
        if (u && u.id) { r.id = u.id; delete r.virtual; }
        if (u && 'completed_at' in u) r.completed_at = u.completed_at;
        if (isW && u && u.weight_lbs !== undefined) r.weight_lbs = u.weight_lbs;
        paintMini(el, r);
        delete CACHE[r.day];
        say((isW ? 'Weight ' + Number(v).toFixed(1) + ' lbs' : 'Wake-up ' + v) + ' saved · ' +
            label(r.day, { month: 'short', day: 'numeric' }) + (isW && u && u.warning ? ' — ' + u.warning : ''));
      }).catch(function (e) {
        r.is_completed = was; paintMini(el, r); input.value = shown; say(e.message, true);
      });
    });
    return el;
  }

  var shownToday = todayNow();
  function rollover() {
    var t = todayNow();
    if (t === shownToday) return;
    var was = shownToday;
    shownToday = t;
    BOOT.today = t;
    var wasOnToday = VIEW === 'day' ? DAY === was : rangeOf(VIEW, DAY)[0] <= was && was <= rangeOf(VIEW, DAY)[1];
    go(VIEW, wasOnToday ? t : DAY, { replace: true });
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) rollover(); });
  window.addEventListener('focus', rollover);
  setInterval(rollover, 60000);

  go(VIEW, DAY, { replace: true });
})();
</script>
