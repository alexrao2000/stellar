name: Daily task sync

on:
  # NOTE (2026-07-30): scheduled sync DISABLED pending data reconciliation.
  # The unattended job was writing incomplete/stale data — it only ever fetched
  # completed tasks (completedMin dropped needsAction), and the DB's completion
  # state diverged from Google. Do not re-enable until the fix branch
  # (fix/sync-missed-days-and-instance-folding) is merged AND the Google/Supabase
  # data is reconciled. To re-enable, uncomment the schedule block below.
  # schedule:
  #   # Times are UTC. Pacific is UTC-7 (PDT) / UTC-8 (PST).
  #   - cron: "0 9 * * *"   # ~02:00 PT
  #   - cron: "0 21 * * *"  # ~14:00 PT
  workflow_dispatch: {}    # manual runs from the Actions tab still allowed

concurrency:
  group: task-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      STORAGE_BACKEND: supabase
      # LOCAL_TIMEZONE intentionally unset: the sync resolves the timezone from
      # the Google Calendar setting so day-bucketing is correct on UTC runners.
      INCLUDE_CALENDAR_EVENTS: "false"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        run: python -m src.sync
